name: toucan-shelf

services:
  toucan-shelf:
    build:
      context: .
      dockerfile: Dockerfile
    image: toucan-shelf:local
    container_name: toucan-shelf
    restart: unless-stopped
    volumes:
      - memos-data:/var/opt/memos
    ports:
      - "${MEMOS_PORT:-5230}:5230"
    environment:
      - TZ=${TZ:-UTC}
      # Public URL users actually reach, e.g. https://toucan.huzhi.dev.
      # Required for MCP OAuth: the discovery documents under /.well-known are
      # built from it, and behind a reverse proxy the Host header is not
      # trustworthy enough to derive it. Leaving it empty also keeps the
      # instance in "private" mode (no anonymous access).
      - MEMOS_INSTANCE_URL=${MEMOS_INSTANCE_URL:-}

volumes:
  memos-data:
    # Keep the physical volume name stable across checkout-directory and Compose
    # project-name changes. Existing deployments already use this volume.
    name: ${MEMOS_DATA_VOLUME:-memos_memos-data}
