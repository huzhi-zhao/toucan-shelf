<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/mobile.webmanifest" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ToucanShelf" />
    <title>ToucanShelf</title>
    <style>
      /* Shown until the app renders into #root, which replaces it; the same spinner as LoadingScreen. */
      html, body { margin: 0; background: #f2f2f7; }
      .boot { display: flex; min-height: 100dvh; align-items: center; justify-content: center; }
      .boot span {
        width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%;
        border: 2.5px solid rgba(0, 0, 0, 0.1); border-top-color: rgba(0, 0, 0, 0.45);
        opacity: 0; animation: boot-in 0s 0.2s forwards, boot-spin 1s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        html, body { background: #000; }
        .boot span { border-color: rgba(255, 255, 255, 0.15); border-top-color: rgba(255, 255, 255, 0.6); }
      }
      @keyframes boot-in { to { opacity: 1; } }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="加载中"><span></span></div></div>
    <script type="module" src="/src/mobile/main.tsx"></script>
  </body>
</html>
