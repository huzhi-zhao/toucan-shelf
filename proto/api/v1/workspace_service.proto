syntax = "proto3";

package memos.api.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "gen/api/v1";

service WorkspaceService {
  // CreateWorkspace creates a new workspace (knowledge base) for the current user.
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (Workspace) {
    option (google.api.http) = {
      post: "/api/v1/workspaces"
      body: "workspace"
    };
    option (google.api.method_signature) = "workspace";
  }
  // ListWorkspaces lists all workspaces owned by the current user.
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse) {
    option (google.api.http) = {get: "/api/v1/workspaces"};
  }
  // GetWorkspace returns a workspace by name.
  rpc GetWorkspace(GetWorkspaceRequest) returns (Workspace) {
    option (google.api.http) = {get: "/api/v1/{name=workspaces/*}"};
    option (google.api.method_signature) = "name";
  }
  // UpdateWorkspace updates a workspace.
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (Workspace) {
    option (google.api.http) = {
      patch: "/api/v1/{workspace.name=workspaces/*}"
      body: "workspace"
    };
    option (google.api.method_signature) = "workspace,update_mask";
  }
  // DeleteWorkspace permanently deletes a workspace. The workspace must contain no
  // memos. NOT exposed in the UI: the product-level "delete" is the reversible
  // `hidden` flag instead. Kept for API compatibility — do not wire it back up
  // without a deliberate decision.
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/{name=workspaces/*}"};
    option (google.api.method_signature) = "name";
  }
  // GetWorkspaceTree returns the folder/document hierarchy for a workspace.
  rpc GetWorkspaceTree(GetWorkspaceTreeRequest) returns (GetWorkspaceTreeResponse) {
    option (google.api.http) = {get: "/api/v1/{name=workspaces/*}/tree"};
  }
  // CreateWorkspaceFolder creates a (possibly empty) folder within a workspace.
  rpc CreateWorkspaceFolder(CreateWorkspaceFolderRequest) returns (WorkspaceFolder) {
    option (google.api.http) = {
      post: "/api/v1/{parent=workspaces/*}/folders"
      body: "folder"
    };
  }
  // RenameWorkspaceFolder renames a folder and moves all memos/subfolders under it.
  rpc RenameWorkspaceFolder(RenameWorkspaceFolderRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/{parent=workspaces/*}/folders:rename"
      body: "*"
    };
  }
  // MoveWorkspaceFolder moves a folder (and everything under it) into another
  // workspace. Moving within a single workspace is RenameWorkspaceFolder's job.
  rpc MoveWorkspaceFolder(MoveWorkspaceFolderRequest) returns (MoveWorkspaceFolderResponse) {
    option (google.api.http) = {
      post: "/api/v1/{parent=workspaces/*}/folders:move"
      body: "*"
    };
  }
  // DeleteWorkspaceFolder deletes an empty folder.
  rpc DeleteWorkspaceFolder(DeleteWorkspaceFolderRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/{parent=workspaces/*}/folders:delete"
      body: "*"
    };
  }
  // ListWorkspaceGrants lists who has been given access to a workspace. Admin only.
  rpc ListWorkspaceGrants(ListWorkspaceGrantsRequest) returns (ListWorkspaceGrantsResponse) {
    option (google.api.http) = {get: "/api/v1/{parent=workspaces/*}/grants"};
  }
  // CreateWorkspaceGrant gives one member access to one workspace. Admin only.
  rpc CreateWorkspaceGrant(CreateWorkspaceGrantRequest) returns (WorkspaceGrant) {
    option (google.api.http) = {
      post: "/api/v1/{parent=workspaces/*}/grants"
      body: "grant"
    };
  }
  // UpdateWorkspaceGrant switches an existing grant between VIEWER and EDITOR. Admin only.
  rpc UpdateWorkspaceGrant(UpdateWorkspaceGrantRequest) returns (WorkspaceGrant) {
    option (google.api.http) = {
      patch: "/api/v1/{grant.name=workspaces/*/grants/*}"
      body: "grant"
    };
    option (google.api.method_signature) = "grant,update_mask";
  }
  // DeleteWorkspaceGrant revokes a member's access to a workspace. Admin only.
  rpc DeleteWorkspaceGrant(DeleteWorkspaceGrantRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/{name=workspaces/*/grants/*}"};
    option (google.api.method_signature) = "name";
  }
}

message Workspace {
  option (google.api.resource) = {
    type: "memos.api.v1/Workspace"
    pattern: "workspaces/{workspace}"
    name_field: "name"
    singular: "workspace"
    plural: "workspaces"
  };

  // The resource name of the workspace.
  // Format: workspaces/{workspace}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Required. The display title of the workspace.
  string title = 2 [(google.api.field_behavior) = REQUIRED];

  // Output only. The name of the creator.
  // Format: users/{user}
  string creator = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The creation timestamp.
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The last update timestamp.
  google.protobuf.Timestamp update_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The field used to sort the workspace's document tree.
  // One of "createTime", "updateTime", "alphabetical". Defaults to "createTime".
  string sort_field = 6;

  // The order used to sort the workspace's document tree.
  // One of "asc", "desc". Defaults to "desc".
  string sort_order = 7;

  // The cover color of the workspace, as a CSS color value (e.g. "#3b82f6").
  string cover_color = 8;

  // The cover image of the workspace. Format: attachments/{attachment}
  string cover_image = 9;

  // Whether folders are always sorted before documents at the same level.
  bool folders_first = 10;

  // Manual position on the bookshelf. Smaller sorts first. Neither unique nor
  // contiguous — ties fall back to create_time.
  int32 display_order = 11;

  // Whether the workspace is hidden (a soft delete). Hidden workspaces are left
  // out of list responses unless show_hidden is set, but stay readable by name.
  bool hidden = 12;
}

message WorkspaceFolder {
  // The resource name of the folder.
  // Format: workspaces/{workspace}/folders/{folder}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Required. The slash-separated path of the folder, relative to the workspace root.
  string path = 2 [(google.api.field_behavior) = REQUIRED];
}

// A single node (folder or document) in a workspace's hierarchy.
message WorkspaceTreeNode {
  enum NodeType {
    NODE_TYPE_UNSPECIFIED = 0;
    FOLDER = 1;
    DOCUMENT = 2;
  }
  NodeType type = 1;

  // The display name of this node (folder name, or document title).
  string name = 2;

  // The full slash-separated path of this node, relative to the workspace root.
  string path = 3;

  // Set only when type == DOCUMENT. Format: memos/{memo}
  string memo = 4;

  // Set only when type == DOCUMENT.
  bool archived = 5;

  // Set only when type == DOCUMENT. One of MARKDOWN, HTML.
  string doc_type = 6;

  // Set only when type == DOCUMENT.
  google.protobuf.Timestamp create_time = 7;

  // Children of this node, populated only for FOLDER nodes.
  repeated WorkspaceTreeNode children = 8;

  // Set only when type == DOCUMENT.
  google.protobuf.Timestamp update_time = 9;
}

message CreateWorkspaceRequest {
  // Required. The workspace to create.
  Workspace workspace = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListWorkspacesRequest {
  // Whether to include hidden workspaces. Defaults to false, which returns only
  // visible ones. The bookshelf's "show hidden" toggle is what sets it.
  bool show_hidden = 1;
}

message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

message GetWorkspaceRequest {
  // Required. Format: workspaces/{workspace}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/Workspace"}
  ];
}

message UpdateWorkspaceRequest {
  // Required. The workspace which replaces the workspace on the server.
  Workspace workspace = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The list of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

message DeleteWorkspaceRequest {
  // Required. Format: workspaces/{workspace}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/Workspace"}
  ];
}

message GetWorkspaceTreeRequest {
  // Required. Format: workspaces/{workspace}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/Workspace"}
  ];

  // Optional. If true, only archived documents are included. If false (default),
  // only non-archived documents are included.
  bool archived = 2 [(google.api.field_behavior) = OPTIONAL];
}

message GetWorkspaceTreeResponse {
  repeated WorkspaceTreeNode nodes = 1;
}

message CreateWorkspaceFolderRequest {
  // Required. Format: workspaces/{workspace}
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The folder to create.
  WorkspaceFolder folder = 2 [(google.api.field_behavior) = REQUIRED];
}

message RenameWorkspaceFolderRequest {
  // Required. Format: workspaces/{workspace}
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The current folder path.
  string old_path = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. The new folder path.
  string new_path = 3 [(google.api.field_behavior) = REQUIRED];
}

message MoveWorkspaceFolderRequest {
  // Required. The workspace the folder currently lives in.
  // Format: workspaces/{workspace}
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The folder path to move, relative to the source workspace root.
  string path = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. The workspace to move the folder into.
  // Format: workspaces/{workspace}
  string destination_workspace = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional. The destination parent folder within destination_workspace. Empty
  // means the destination workspace's root. The moved folder keeps its own name,
  // so it ends up at "{destination_folder_path}/{name}".
  string destination_folder_path = 4 [(google.api.field_behavior) = OPTIONAL];
}

message MoveWorkspaceFolderResponse {
  // The folder's new path within the destination workspace.
  string new_path = 1;

  // How many documents were moved.
  int32 moved_document_count = 2;
}

message DeleteWorkspaceFolderRequest {
  // Required. Format: workspaces/{workspace}
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The folder path to delete. Must contain no memos or subfolders.
  string path = 2 [(google.api.field_behavior) = REQUIRED];
}

// WorkspaceGrant is one member's access to one knowledge base. The team owner (the
// single ADMIN account) never has a grant: its access to every workspace is implicit.
message WorkspaceGrant {
  enum Role {
    ROLE_UNSPECIFIED = 0;
    // VIEWER may read the workspace's documents, subject to each document's visibility.
    VIEWER = 1;
    // EDITOR may additionally create, edit and delete documents. Workspace-level
    // operations (rename, settings, folders, grants) stay admin-only either way.
    EDITOR = 2;
  }

  // The resource name of the grant.
  // Format: workspaces/{workspace}/grants/{grant}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Required. The member this grant is issued to. Format: users/{user}
  string user = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. The access level granted.
  Role role = 3 [(google.api.field_behavior) = REQUIRED];

  // Output only. The workspace this grant applies to. Format: workspaces/{workspace}
  string workspace = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Who issued the grant. Format: users/{user}
  string granter = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. When the grant was issued.
  google.protobuf.Timestamp create_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListWorkspaceGrantsRequest {
  // Required. The workspace to list grants for. Format: workspaces/{workspace}.
  // Use the wildcard "workspaces/-" together with `user` to list one member's
  // grants across every workspace — that is what the member settings page needs.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. Only return grants issued to this member. Format: users/{user}
  string user = 2 [(google.api.field_behavior) = OPTIONAL];
}

message ListWorkspaceGrantsResponse {
  repeated WorkspaceGrant grants = 1;
}

message CreateWorkspaceGrantRequest {
  // Required. Format: workspaces/{workspace}
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The grant to create.
  WorkspaceGrant grant = 2 [(google.api.field_behavior) = REQUIRED];
}

message UpdateWorkspaceGrantRequest {
  // Required. The grant which replaces the grant on the server.
  WorkspaceGrant grant = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The list of fields to update. Only "role" is updatable.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

message DeleteWorkspaceGrantRequest {
  // Required. Format: workspaces/{workspace}/grants/{grant}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}
