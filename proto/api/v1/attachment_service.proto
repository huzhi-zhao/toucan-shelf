syntax = "proto3";

package memos.api.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "gen/api/v1";

service AttachmentService {
  // CreateAttachment creates a new attachment.
  rpc CreateAttachment(CreateAttachmentRequest) returns (Attachment) {
    option (google.api.http) = {
      post: "/api/v1/attachments"
      body: "attachment"
    };
    option (google.api.method_signature) = "attachment";
  }
  // ListAttachments lists all attachments.
  rpc ListAttachments(ListAttachmentsRequest) returns (ListAttachmentsResponse) {
    option (google.api.http) = {get: "/api/v1/attachments"};
  }
  // GetAttachment returns an attachment by name.
  rpc GetAttachment(GetAttachmentRequest) returns (Attachment) {
    option (google.api.http) = {get: "/api/v1/{name=attachments/*}"};
    option (google.api.method_signature) = "name";
  }
  // UpdateAttachment updates an attachment.
  rpc UpdateAttachment(UpdateAttachmentRequest) returns (Attachment) {
    option (google.api.http) = {
      patch: "/api/v1/{attachment.name=attachments/*}"
      body: "attachment"
    };
    option (google.api.method_signature) = "attachment,update_mask";
  }
  // DeleteAttachment deletes an attachment by name.
  rpc DeleteAttachment(DeleteAttachmentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/{name=attachments/*}"};
    option (google.api.method_signature) = "name";
  }
  // UnlinkAttachment detaches an attachment from its memo without deleting the
  // underlying file. Use this instead of DeleteAttachment when the attachment may
  // still be referenced by a saved memo version, so restoring that version can
  // relink it later.
  rpc UnlinkAttachment(UnlinkAttachmentRequest) returns (Attachment) {
    option (google.api.http) = {post: "/api/v1/{name=attachments/*}:unlink"};
    option (google.api.method_signature) = "name";
  }
  // BatchDeleteAttachments deletes multiple attachments in one request.
  rpc BatchDeleteAttachments(BatchDeleteAttachmentsRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/attachments:batchDelete"
      body: "*"
    };
  }
  // UnlockVault opens the caller's attachment vault for this browser session by
  // verifying proof of the master key used by `toucan-secret` blocks, and issues
  // an HttpOnly vault cookie on success. This is a lock, not encryption: locked
  // attachments are stored unencrypted, and this call only gates whether
  // ToucanShelf will serve them. See
  // docs/dev/requirements/attachments/access-control-and-private-files.md, part B.
  rpc UnlockVault(UnlockVaultRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/attachments:unlockVault"
      body: "*"
    };
  }
  // LockVault clears the vault cookie, immediately re-locking every locked
  // attachment for this browser session.
  rpc LockVault(LockVaultRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {post: "/api/v1/attachments:lockVault"};
  }
  // GetDownloadUrl issues a short-lived URL for one attachment's bytes,
  // carrying its own authorization so a client with no session of its own can
  // fetch it once. The flow is: get the URL, fetch it to a local file, read the
  // file. Bytes are never returned inline.
  //
  // Only formats a reader can actually open are served: text, PDF, common
  // raster images and SVG. Office files, audio, video and vault-locked
  // attachments are refused outright rather than handed a URL to bytes nothing
  // can use.
  //
  // The caller's own read access is checked when the URL is issued and again
  // when it is fetched. POST rather than GET because the request field is
  // deliberately lenient about its input shape; it mutates nothing.
  //
  // See docs/dev/requirements/collaboration/agent-attachment-reading.md §3.
  rpc GetDownloadUrl(GetDownloadUrlRequest) returns (GetDownloadUrlResponse) {
    option (google.api.http) = {
      post: "/api/v1/attachments:downloadUrl"
      body: "*"
    };
  }
}

enum MotionMediaFamily {
  MOTION_MEDIA_FAMILY_UNSPECIFIED = 0;
  APPLE_LIVE_PHOTO = 1;
  ANDROID_MOTION_PHOTO = 2;
}

enum MotionMediaRole {
  MOTION_MEDIA_ROLE_UNSPECIFIED = 0;
  STILL = 1;
  VIDEO = 2;
  CONTAINER = 3;
}

message MotionMedia {
  MotionMediaFamily family = 1;
  MotionMediaRole role = 2;
  string group_id = 3;
  int64 presentation_timestamp_us = 4;
  bool has_embedded_video = 5;
}

enum AttachmentOrigin {
  ATTACHMENT_ORIGIN_UNSPECIFIED = 0;
  // Uploaded via the attachment panel/list, shown as a mounted attachment.
  MOUNTED = 1;
  // Pasted/dropped into the editor and referenced inline via `![]()` markdown.
  INLINE = 2;
}

message Attachment {
  option (google.api.resource) = {
    type: "memos.api.v1/Attachment"
    pattern: "attachments/{attachment}"
    singular: "attachment"
    plural: "attachments"
  };

  // The name of the attachment.
  // Format: attachments/{attachment}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The creation timestamp.
  google.protobuf.Timestamp create_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The filename of the attachment.
  string filename = 3 [(google.api.field_behavior) = REQUIRED];

  // Input only. The content of the attachment.
  bytes content = 4 [(google.api.field_behavior) = INPUT_ONLY];

  // Optional. The external link of the attachment.
  string external_link = 5 [(google.api.field_behavior) = OPTIONAL];

  // The MIME type of the attachment.
  string type = 6 [(google.api.field_behavior) = REQUIRED];

  // Output only. The size of the attachment in bytes.
  int64 size = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The related memo. Refer to `Memo.name`.
  // Format: memos/{memo}
  optional string memo = 8 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Motion media metadata.
  MotionMedia motion_media = 9 [(google.api.field_behavior) = OPTIONAL];

  // Optional. How the attachment was created: mounted vs. inlined into memo content.
  AttachmentOrigin origin = 10 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Opaque, client-owned JSON blob of per-attachment reader preferences
  // (e.g. the EPUB reader's theme/font/spacing settings). The server stores it
  // verbatim and never interprets it. Updated via UpdateAttachment with the
  // "reader_settings" field mask.
  string reader_settings = 11 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Mirror of `access == ACCESS_LOCKED`, kept so callers written
  // against the two-state API keep working. Write through `access` instead.
  bool locked = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. How this attachment answers read requests, independent of the
  // document it hangs on. Updated via UpdateAttachment with the "access" field
  // mask (the older "locked" mask still works and maps onto this field).
  //
  // ACCESS_LOCKED requires the creator to have an unlock_verifier on file (see
  // UserSetting.SecretKeySetting) or the update is rejected; ACCESS_PUBLIC may
  // only be set by the creator, never by an admin acting on their behalf. See
  // docs/dev/requirements/attachments/access-control-and-private-files.md.
  AttachmentAccess access = 13 [(google.api.field_behavior) = OPTIONAL];
}

// AttachmentAccess is the attachment-level override of the "an attachment is
// exactly as reachable as the document it hangs on" default.
enum AttachmentAccess {
  // Inherit the document's visibility. The default for every attachment.
  ACCESS_INHERIT = 0;

  // Locked behind the creator's vault: readable only by the creator, over a
  // browser session that has called UnlockVault. Not admins, not share links,
  // not anonymous visitors.
  ACCESS_LOCKED = 1;

  // Readable by anyone holding the URL, anonymous visitors included, even when
  // the document and its knowledge base are private. Still 404s once the
  // document is in the recycle bin, and still requires the instance to allow
  // anonymous access at all (i.e. to have an instance URL configured).
  ACCESS_PUBLIC = 2;
}

message CreateAttachmentRequest {
  // Required. The attachment to create.
  Attachment attachment = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The attachment ID to use for this attachment.
  // If empty, a unique ID will be generated.
  string attachment_id = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The workspace this attachment belongs to, as "workspaces/{uid}".
  // It decides the workspace directory the blob is stored under in S3 (the
  // `{workspace}` placeholder of the instance filepath template), so it must be
  // supplied at upload time — the attachment is usually not linked to a memo yet.
  // When omitted the blob lands under a shared fallback prefix.
  string workspace = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListAttachmentsRequest {
  // Optional. The maximum number of attachments to return.
  // The service may return fewer than this value.
  // If unspecified, at most 50 attachments will be returned.
  // The maximum value is 1000; values above 1000 will be coerced to 1000.
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous `ListAttachments` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Filter to apply to the list results.
  // Example: "mime_type==\"image/png\"" or "filename.contains(\"test\")"
  // Supported operators: =, !=, <, <=, >, >=, : (contains), in
  // Supported fields: filename, mime_type, create_time, memo_id, access
  // `access` compares against the enum name, e.g. access == "ACCESS_PUBLIC" —
  // which is how the settings list of publicly linkable attachments is built.
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The order to sort results by.
  // Example: "create_time desc" or "filename asc"
  string order_by = 4 [(google.api.field_behavior) = OPTIONAL];
}

message ListAttachmentsResponse {
  // The list of attachments.
  repeated Attachment attachments = 1;

  // A token that can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

message GetAttachmentRequest {
  // Required. The attachment name of the attachment to retrieve.
  // Format: attachments/{attachment}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/Attachment"}
  ];
}

message UpdateAttachmentRequest {
  // Required. The attachment which replaces the attachment on the server.
  Attachment attachment = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The list of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

message UnlinkAttachmentRequest {
  // Required. The attachment name of the attachment to unlink.
  // Format: attachments/{attachment}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/Attachment"}
  ];
}

message DeleteAttachmentRequest {
  // Required. The attachment name of the attachment to delete.
  // Format: attachments/{attachment}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/Attachment"}
  ];
}

message BatchDeleteAttachmentsRequest {
  repeated string names = 1 [(google.api.field_behavior) = REQUIRED];
}

message UnlockVaultRequest {
  // Required. HMAC-SHA256(master key, "toucan-attach/unlock/v1"), base64-encoded,
  // computed client-side from the unwrapped master key. Compared against the
  // caller's stored unlock_verifier in constant time.
  string proof = 1 [(google.api.field_behavior) = REQUIRED];
}

message LockVaultRequest {}

message GetDownloadUrlRequest {
  // Required. Which attachment to issue a URL for. Lenient about shape, because
  // this is usually pasted by a person: a resource name ("attachments/{uid}"),
  // a /file/... link relative or absolute, or the markdown reference the app's
  // attachment menu copies ("![report.pdf](/file/attachments/{uid}/report.pdf)")
  // all address the same attachment.
  string attachment = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetDownloadUrlResponse {
  // The URL to fetch. Absolute, carries its own authorization, and is valid
  // only for this one attachment until expire_time.
  string url = 1;

  // The attachment's resource name, resolved from the request.
  // Format: attachments/{attachment}
  string name = 2;

  // The display filename, suitable as the local filename to save under.
  string filename = 3;

  // The MIME type of the bytes the URL will serve.
  string type = 4;

  // Size in bytes, so a caller can decide whether it wants the file at all
  // before fetching it.
  int64 size = 5;

  // When the URL stops working.
  google.protobuf.Timestamp expire_time = 6;
}
