syntax = "proto3";

package memos.api.v1;

import "api/v1/user_service.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/type/color.proto";

option go_package = "gen/api/v1";

service InstanceService {
  // Gets the instance profile.
  rpc GetInstanceProfile(GetInstanceProfileRequest) returns (InstanceProfile) {
    option (google.api.http) = {get: "/api/v1/instance/profile"};
  }

  // Gets an instance setting.
  rpc GetInstanceSetting(GetInstanceSettingRequest) returns (InstanceSetting) {
    option (google.api.http) = {get: "/api/v1/{name=instance/settings/*}"};
    option (google.api.method_signature) = "name";
  }

  // Batch gets instance settings.
  rpc BatchGetInstanceSettings(BatchGetInstanceSettingsRequest) returns (BatchGetInstanceSettingsResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/settings:batchGet"
      body: "*"
    };
  }

  // Updates an instance setting.
  rpc UpdateInstanceSetting(UpdateInstanceSettingRequest) returns (InstanceSetting) {
    option (google.api.http) = {
      patch: "/api/v1/{setting.name=instance/settings/*}"
      body: "setting"
    };
    option (google.api.method_signature) = "setting,update_mask";
  }

  // Tests notification email delivery with the provided or stored SMTP settings.
  rpc TestInstanceEmailSetting(TestInstanceEmailSettingRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/instance/settings/notification:testEmail"
      body: "*"
    };
  }

  // GetInstanceStats returns resource usage statistics for the instance. Admin only.
  rpc GetInstanceStats(GetInstanceStatsRequest) returns (InstanceStats) {
    option (google.api.http) = {get: "/api/v1/instance/stats"};
  }

  // BackupNow triggers an immediate database backup to the configured S3 storage.
  // Only available when the instance uses SQLite and S3 storage is configured. Admin only.
  rpc BackupNow(BackupNowRequest) returns (BackupNowResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/settings/backup:backupNow"
      body: "*"
    };
  }

  // PrecheckStorageMigration writes, reads back and deletes a probe object at the drafted
  // migration target, then records the outcome on the migration setting. Admin only.
  rpc PrecheckStorageMigration(PrecheckStorageMigrationRequest) returns (InstanceSetting) {
    option (google.api.http) = {
      post: "/api/v1/instance/settings/storageMigration:precheck"
      body: "*"
    };
  }

  // StartStorageMigration freezes attachment writes, builds the work list and starts copying
  // objects to the prechecked target. Admin only.
  rpc StartStorageMigration(StartStorageMigrationRequest) returns (InstanceSetting) {
    option (google.api.http) = {
      post: "/api/v1/instance/settings/storageMigration:start"
      body: "*"
    };
  }

  // RetryStorageMigration puts every failed object back in the queue and resumes copying.
  // Admin only.
  rpc RetryStorageMigration(RetryStorageMigrationRequest) returns (InstanceSetting) {
    option (google.api.http) = {
      post: "/api/v1/instance/settings/storageMigration:retry"
      body: "*"
    };
  }

  // SwitchStorageMigration points the instance at the target: every attachment's object key and
  // the instance storage configuration are rewritten in one transaction, and attachment writes
  // are unfrozen. Refused while any object has failed. Admin only.
  rpc SwitchStorageMigration(SwitchStorageMigrationRequest) returns (InstanceSetting) {
    option (google.api.http) = {
      post: "/api/v1/instance/settings/storageMigration:switch"
      body: "*"
    };
  }

  // AbandonStorageMigration drops the work list and unfreezes attachment writes. Objects already
  // copied to the target are left where they are for the operator to delete. Admin only.
  rpc AbandonStorageMigration(AbandonStorageMigrationRequest) returns (InstanceSetting) {
    option (google.api.http) = {
      post: "/api/v1/instance/settings/storageMigration:abandon"
      body: "*"
    };
  }

  // TestAIProvider verifies connectivity to an AI provider by making a minimal live API call.
  // The provider connection may be given inline (for testing before save) or by provider_id
  // (for testing an already-stored provider, optionally overriding its API key).
  rpc TestAIProvider(TestAIProviderRequest) returns (TestAIProviderResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance/settings/ai:testProvider"
      body: "*"
    };
  }
}

message PrecheckStorageMigrationRequest {}

message StartStorageMigrationRequest {}

message RetryStorageMigrationRequest {}

message SwitchStorageMigrationRequest {}

message AbandonStorageMigrationRequest {}

message BackupNowRequest {}

message BackupNowResponse {
  google.protobuf.Timestamp backup_time = 1;
}

// Instance profile message containing basic instance information.
message InstanceProfile {
  // Version is the current version of instance.
  string version = 2;

  // Demo indicates if the instance is in demo mode.
  bool demo = 3;

  // Instance URL is the URL of the instance.
  string instance_url = 6;

  // The first administrator who set up this instance, for display purposes.
  // May be null on an instance that has lost all admins; use needs_setup to
  // determine whether initial setup is actually required.
  User admin = 7;

  // Commit is the current build commit of instance.
  string commit = 8;

  // NeedsSetup is true when the instance has no users yet and requires initial
  // setup (creating the first admin account). Unlike a null admin, this stays
  // false once any user exists, so an instance that has lost its admins is not
  // mistaken for a fresh install.
  bool needs_setup = 9;
}

// Request for instance profile.
message GetInstanceProfileRequest {}

// An instance setting resource.
message InstanceSetting {
  option (google.api.resource) = {
    type: "memos.api.v1/InstanceSetting"
    pattern: "instance/settings/{setting}"
    singular: "instanceSetting"
    plural: "instanceSettings"
  };

  // The name of the instance setting.
  // Format: instance/settings/{setting}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  oneof value {
    GeneralSetting general_setting = 2;
    StorageSetting storage_setting = 3;
    MemoRelatedSetting memo_related_setting = 4;
    TagsSetting tags_setting = 5;
    NotificationSetting notification_setting = 6;
    AISetting ai_setting = 7;
    BackupSetting backup_setting = 8;
    StorageMigrationSetting storage_migration_setting = 9;
  }

  // Enumeration of instance setting keys.
  enum Key {
    KEY_UNSPECIFIED = 0;
    // GENERAL is the key for general settings.
    GENERAL = 1;
    // STORAGE is the key for storage settings.
    STORAGE = 2;
    // MEMO_RELATED is the key for memo related settings.
    MEMO_RELATED = 3;
    // TAGS is the key for tag metadata.
    TAGS = 4;
    // NOTIFICATION is the key for notification transport settings.
    NOTIFICATION = 5;
    // AI is the key for AI provider settings.
    AI = 6;
    // BACKUP is the key for database backup settings/status.
    BACKUP = 7;
    // STORAGE_MIGRATION is the key for the in-flight attachment storage migration.
    STORAGE_MIGRATION = 8;
  }

  // General instance settings configuration.
  message GeneralSetting {
    // disallow_user_registration disallows user registration.
    bool disallow_user_registration = 2;
    // disallow_password_auth disallows password authentication.
    bool disallow_password_auth = 3;
    // additional_script is the additional script.
    string additional_script = 4;
    // additional_style is the additional style.
    string additional_style = 5;
    // custom_profile is the custom profile.
    CustomProfile custom_profile = 6;
    // week_start_day_offset is the week start day offset from Sunday.
    // 0: Sunday, 1: Monday, 2: Tuesday, 3: Wednesday, 4: Thursday, 5: Friday, 6: Saturday
    // Default is Sunday.
    int32 week_start_day_offset = 7;

    // disallow_change_username disallows changing username.
    bool disallow_change_username = 8;
    // disallow_change_nickname disallows changing nickname.
    bool disallow_change_nickname = 9;

    // Custom profile configuration for instance branding.
    message CustomProfile {
      string title = 1;
      string description = 2;
      string logo_url = 3;
    }
  }

  // Storage configuration settings for instance attachments.
  message StorageSetting {
    // Storage type enumeration for different storage backends.
    enum StorageType {
      STORAGE_TYPE_UNSPECIFIED = 0;
      // DATABASE is the database storage type.
      DATABASE = 1;
      // LOCAL is the local storage type.
      LOCAL = 2;
      // S3 is the S3 storage type.
      S3 = 3;
    }
    // storage_type is the storage type.
    StorageType storage_type = 1;
    // LEGACY-COMPAT(storage/three-level-path): the whole object path as a single free-form
    // string. Still the source of truth for LOCAL storage; for S3 the path is now
    // root_prefix + workspace directory + filename_template.
    // e.g. assets/{timestamp}_{filename}
    string filepath_template = 2;
    // The max upload size in megabytes.
    int64 upload_size_limit_mb = 3;

    // S3 configuration for cloud storage backend.
    // Reference: https://developers.cloudflare.com/r2/examples/aws/aws-sdk-go/
    message S3Config {
      string access_key_id = 1;
      string access_key_secret = 2 [(google.api.field_behavior) = INPUT_ONLY];
      string endpoint = 3;
      string region = 4;
      string bucket = 5;
      bool use_path_style = 6;
      // insecure_skip_tls_verify disables TLS certificate verification when connecting
      // to the S3 endpoint. Only enable this for trusted endpoints that use a self-signed
      // certificate; it removes protection against man-in-the-middle attacks.
      bool insecure_skip_tls_verify = 7;
      // root_prefix is the directory every attachment object is written under, relative to
      // the bucket root. Empty means the bucket root itself. Together with `endpoint` and
      // `bucket` it says which storage the data lives in, so all three are read-only once S3
      // attachments exist and can only be changed through an attachment storage migration.
      string root_prefix = 8;
    }
    // The S3 config.
    S3Config s3_config = 4;
    // filename_template names the final path segment of an S3 object; it governs the file name
    // only, never directories. The directory between the root prefix and the file name is the
    // owning workspace's storage slug and is not configurable.
    // e.g. {timestamp}_{uuid}_{filename}
    string filename_template = 5;
  }

  // Memo-related instance settings and policies.
  message MemoRelatedSetting {
    reserved 2;
    reserved "display_with_update_time";
    // content_length_limit is the limit of content length. Unit is byte.
    int32 content_length_limit = 3;
    // enable_double_click_edit enables editing on double click.
    bool enable_double_click_edit = 4;
    // reactions is the list of reactions.
    repeated string reactions = 7;
  }

  // Metadata for a tag.
  message TagMetadata {
    // Optional background color for the tag label.
    // When unset, the default tag color is used.
    google.type.Color background_color = 1;
    // Whether memos with this tag should have their content blurred.
    bool blur_content = 2;
  }

  // Tag metadata configuration.
  // Active tag metadata is stored in per-user tag settings.
  // This message remains for backward compatibility with existing clients and migrations.
  message TagsSetting {
    // Map of tag name pattern to tag metadata.
    // Each key is treated as an anchored regular expression (^pattern$),
    // so a single entry like "project/.*" matches all tags under that prefix.
    // Exact tag names are also valid (they are trivially valid regex patterns).
    map<string, TagMetadata> tags = 1;
  }

  // Notification transport configuration.
  message NotificationSetting {
    EmailSetting email = 1;

    // Email delivery configuration for notifications.
    message EmailSetting {
      bool enabled = 1;
      string smtp_host = 2;
      int32 smtp_port = 3;
      string smtp_username = 4;
      string smtp_password = 5 [(google.api.field_behavior) = INPUT_ONLY];
      string from_email = 6;
      string from_name = 7;
      string reply_to = 8;
      bool use_tls = 9;
      bool use_ssl = 10;
    }
  }

  // AI provider configuration settings.
  message AISetting {
    // providers is the list of AI provider configurations available instance-wide.
    repeated AIProviderConfig providers = 1;

    // transcription is the speech-to-text feature configuration.
    // When unset or transcription.provider_id is empty, transcription is disabled.
    TranscriptionConfig transcription = 2;

    // default_provider_id references an entry in providers[].id. AI features that have
    // no feature-specific provider configuration of their own fall back to this provider.
    // Empty string means no default is set.
    string default_provider_id = 3;

    // format_pdf_text enables running the extracted plain text of a PDF attachment through the
    // default AI provider to restructure it into Markdown when viewing the PDF's plain-text
    // panel. When disabled (the default), the raw extracted text is shown as-is (pages are still
    // separated), avoiding the slow, billable LLM call.
    bool format_pdf_text = 4;

    // embedding configures the text-embedding model used for semantic (vector) search.
    // When unset or embedding.provider_id is empty, semantic search is disabled and
    // search falls back to full-text (keyword) retrieval only.
    EmbeddingConfig embedding = 5;
  }

  // EmbeddingConfig configures the text-embedding model used to power semantic search.
  message EmbeddingConfig {
    // provider_id references an entry in AISetting.providers[].id.
    // Empty string means semantic search is disabled (keyword-only fallback).
    string provider_id = 1;
    // model is the provider-specific embedding model identifier.
    // OPENAI examples: text-embedding-3-small, text-embedding-3-large.
    // GEMINI examples: text-embedding-004.
    string model = 2;
    // disabled turns off vector building and semantic retrieval while keeping the
    // provider/model selection above. Keyword (FTS) search is unaffected; re-enabling
    // triggers a full backfill of the missing vectors.
    bool disabled = 3;
  }

  // BackupSetting configures and reports the status of the weekly/manual SQLite-to-S3 database
  // backup. This is instance-wide, admin-only. path_template is editable via UpdateInstanceSetting;
  // the last_backup_* fields are populated by the server after each run and are preserved
  // automatically when only path_template is updated.
  message BackupSetting {
    // path_template is the S3 object key template for backup files, relative to the configured
    // bucket. Supports the same placeholders as StorageSetting.filepath_template ({timestamp},
    // {uuid}, {year}, {month}, {day}, {hour}, {minute}, {second}); there is no {filename}
    // placeholder since backups have no source filename.
    // e.g. backups/{timestamp}_{uuid}.db.gz
    string path_template = 4;
    // last_backup_time is when the most recent backup attempt finished.
    google.protobuf.Timestamp last_backup_time = 1;
    // last_backup_success indicates whether the most recent backup attempt succeeded.
    bool last_backup_success = 2;
    // last_backup_error holds the error message when last_backup_success is false.
    string last_backup_error = 3;
  }

  // StorageMigrationSetting is the target configuration and state machine of an attachment
  // storage migration: moving every S3 attachment object to a new
  // (endpoint, bucket, root_prefix) location without changing a single attachment's URI.
  message StorageMigrationSetting {
    // State is the migration lifecycle. An absent setting (or STATE_UNSPECIFIED) means no
    // migration exists.
    enum State {
      STATE_UNSPECIFIED = 0;
      // DRAFT: the target configuration is being edited; nothing is frozen or copied.
      DRAFT = 1;
      // PRECHECKED: a probe object round-tripped at the target. Editing the target drops
      // back to DRAFT.
      PRECHECKED = 2;
      // FROZEN: attachment writes are closed instance-wide. Reads are unaffected.
      FROZEN = 3;
      // MIGRATING: objects are being copied to the target location.
      MIGRATING = 4;
      // RECONCILING: every attachment's target object is being verified.
      RECONCILING = 5;
      // READY: reconciliation passed; the switch may be applied.
      READY = 6;
    }

    State state = 1;
    // target_s3_config is where the attachments are going. Only the location triple may differ
    // from the live configuration; a migration that moves nowhere is rejected.
    StorageSetting.S3Config target_s3_config = 2;
    google.protobuf.Timestamp create_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
    google.protobuf.Timestamp update_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
    PrecheckResult precheck = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
    Progress progress = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
    // last_error is the most recent failure of the background worker itself, as opposed to a
    // single object's failure.
    string last_error = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Progress mirrors the per-status counts of the migration's work list.
    message Progress {
      int64 total = 1;
      int64 pending = 2;
      int64 done = 3;
      // skipped counts attachments whose source object does not exist. They were already broken
      // before the migration and do not block it.
      int64 skipped = 4;
      // failed counts attachments that could not be copied or did not verify. Any of these
      // blocks the switch.
      int64 failed = 5;
    }

    // PrecheckResult records the outcome of the write-read-delete probe against the target.
    message PrecheckResult {
      bool passed = 1;
      // error is the failure reason, verbatim enough for an admin to act on.
      string error = 2;
      google.protobuf.Timestamp check_time = 3;
      // probe_key is the object key the probe used, so an object left behind by a crash
      // between write and delete can be found and removed by hand.
      string probe_key = 4;
      // server_side_copy reports whether the migration can hand the copy to S3 itself instead
      // of streaming every byte through Toucan.
      bool server_side_copy = 5;
    }
  }

  // AIProviderConfig represents one callable AI provider connection.
  message AIProviderConfig {
    string id = 1;
    string title = 2;
    AIProviderType type = 3;
    string endpoint = 4;
    // api_key is write-only and is never returned by GetInstanceSetting.
    string api_key = 5 [(google.api.field_behavior) = INPUT_ONLY];
    // api_key_set indicates whether an API key is stored for this provider.
    bool api_key_set = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
    // api_key_hint is a masked hint for the stored API key.
    string api_key_hint = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
    // models is the list of manually-added model IDs available for this provider.
    repeated AIModelConfig models = 10;
  }

  // AIModelConfig is a manually-added model entry under a provider.
  message AIModelConfig {
    // id is the model identifier sent to the provider API (e.g. "deepseek-chat").
    string id = 1;
    // name is an optional display name. Falls back to id when empty.
    string name = 2;
  }

  // AIProviderType is the provider implementation type.
  enum AIProviderType {
    AI_PROVIDER_TYPE_UNSPECIFIED = 0;
    // OPENAI covers OpenAI and any OpenAI-compatible chat-completions API
    // (DeepSeek, MiniMax, SiliconFlow, OpenRouter, Ollama, etc.) via a custom endpoint.
    OPENAI = 1;
    GEMINI = 2;
  }

  // TranscriptionConfig configures the speech-to-text feature.
  message TranscriptionConfig {
    // provider_id references an entry in AISetting.providers[].id.
    // Empty string means transcription is disabled.
    string provider_id = 1;

    // model is the provider-specific model identifier.
    // Empty string falls back to the engine default
    // (whisper-1 for OPENAI providers, gemini-2.5-flash for GEMINI providers).
    string model = 2;

    // language is the default ISO 639-1 language hint sent to the provider.
    // Empty string lets the provider auto-detect.
    string language = 3;

    // prompt is a default spelling/vocabulary hint passed to the provider.
    string prompt = 4;
  }
}

// Request message for GetInstanceSetting method.
message GetInstanceSettingRequest {
  // The resource name of the instance setting.
  // Format: instance/settings/{setting}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/InstanceSetting"}
  ];
}

// Request message for BatchGetInstanceSettings method.
message BatchGetInstanceSettingsRequest {
  // The resource names of the instance settings.
  // Format: instance/settings/{setting}
  repeated string names = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/InstanceSetting"}
  ];
}

// Response message for BatchGetInstanceSettings method.
message BatchGetInstanceSettingsResponse {
  // The instance settings in the same order as the input names.
  repeated InstanceSetting settings = 1;
}

// Request message for UpdateInstanceSetting method.
message UpdateInstanceSettingRequest {
  // The instance setting resource which replaces the resource on the server.
  InstanceSetting setting = 1 [(google.api.field_behavior) = REQUIRED];

  // The list of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for TestInstanceEmailSetting method.
message TestInstanceEmailSettingRequest {
  // Optional. SMTP email settings to test. If omitted, the stored notification email setting is used.
  InstanceSetting.NotificationSetting.EmailSetting email = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Recipient email address. If omitted, the current user's email address is used.
  string recipient_email = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for TestAIProvider.
message TestAIProviderRequest {
  // Optional. References an existing provider in the stored AI setting. When set and
  // api_key is empty, the stored API key for this provider is used.
  string provider_id = 1 [(google.api.field_behavior) = OPTIONAL];

  // The provider type to test.
  InstanceSetting.AIProviderType type = 2;

  // Optional. The endpoint to test. Falls back to the provider's default endpoint when empty.
  string endpoint = 3 [(google.api.field_behavior) = OPTIONAL];

  // The API key to test with. Required unless provider_id references a provider with a stored key.
  string api_key = 4 [(google.api.field_behavior) = INPUT_ONLY];

  // The model ID to use for the test call.
  string model = 5;

  // Optional. The capability to test. Determines which provider endpoint the
  // probe calls. Defaults to CHAT when unset.
  Capability capability = 6 [(google.api.field_behavior) = OPTIONAL];

  // Capability selects which kind of provider call to probe.
  enum Capability {
    CAPABILITY_UNSPECIFIED = 0;
    // CHAT probes the chat/generateContent endpoint.
    CHAT = 1;
    // EMBEDDING probes the embeddings/batchEmbedContents endpoint.
    EMBEDDING = 2;
  }
}

// Response message for TestAIProvider.
message TestAIProviderResponse {
  // success indicates whether the live API call succeeded.
  bool success = 1;

  // message describes the result: a short success confirmation, or the error returned by the provider.
  string message = 2;
}

// Request message for GetInstanceStats.
message GetInstanceStatsRequest {}

// Resource usage statistics for the instance.
message InstanceStats {
  DatabaseStats database = 1;
  // Recursive size of the data directory in bytes. -1 if unavailable.
  int64 local_storage_bytes = 2;
  // Server-side timestamp when the snapshot was generated.
  google.protobuf.Timestamp generated_time = 4;

  // Database size statistics.
  message DatabaseStats {
    // driver is the database driver in use; always "sqlite".
    string driver = 1;
    // size_bytes is the database size in bytes; -1 if unavailable.
    int64 size_bytes = 2;
  }
}
