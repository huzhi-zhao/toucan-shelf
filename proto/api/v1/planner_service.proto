syntax = "proto3";

package memos.api.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "gen/api/v1";

// PlannerService keeps the caller's habits, daily check-ins, todos and notes.
//
// Planner data is personal: every RPC reads and writes the authenticated user's
// own records only, and none of it belongs to a knowledge base. See
// docs/dev/requirements/planner-and-check-in.md.
//
// Dates are "YYYY-MM-DD" strings in the user's phone-local calendar. The server
// stores them as given and never converts time zones; where it needs "today" it
// takes the caller's local date from the request.
service PlannerService {
  // ListHabits returns the caller's whole habit pool, in creation order. Which
  // habits are in use on a day is decided by habit versions.
  rpc ListHabits(ListHabitsRequest) returns (ListHabitsResponse) {
    option (google.api.http) = {get: "/api/v1/planner/habits"};
  }

  // CreateHabit adds a habit to the pool, with a colour no habit of the latest
  // version uses. It is in use only once a version includes it.
  rpc CreateHabit(CreateHabitRequest) returns (Habit) {
    option (google.api.http) = {
      post: "/api/v1/planner/habits"
      body: "habit"
    };
    option (google.api.method_signature) = "habit";
  }

  // UpdateHabit renames a habit or changes its colour, on every day at once.
  rpc UpdateHabit(UpdateHabitRequest) returns (Habit) {
    option (google.api.http) = {
      patch: "/api/v1/{habit.name=planner/habits/*}"
      body: "habit"
    };
    option (google.api.method_signature) = "habit,update_mask";
  }

  // ListHabitVersions returns the caller's enabled habit versions, earliest
  // first, and the draft not yet enabled, if any.
  rpc ListHabitVersions(ListHabitVersionsRequest) returns (ListHabitVersionsResponse) {
    option (google.api.http) = {get: "/api/v1/planner/habitVersions"};
  }

  // UpdateHabitDraft writes the caller's habit plan draft, creating it or
  // replacing the one there. A draft does not take effect until enabled.
  rpc UpdateHabitDraft(UpdateHabitDraftRequest) returns (HabitVersion) {
    option (google.api.http) = {
      patch: "/api/v1/planner/habitDraft"
      body: "draft"
    };
  }

  // DeleteHabitDraft discards the caller's habit plan draft.
  rpc DeleteHabitDraft(DeleteHabitDraftRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/planner/habitDraft"};
  }

  // EnableHabitDraft turns the draft into the version in use from the caller's
  // local date on. A version enabled earlier that day is replaced. Once enabled,
  // a version never changes.
  rpc EnableHabitDraft(EnableHabitDraftRequest) returns (HabitVersion) {
    option (google.api.http) = {
      post: "/api/v1/planner/habitDraft:enable"
      body: "*"
    };
  }

  // ListPlannerEntries returns everything dated within an inclusive range:
  // check-ins, todos of any status, and notes. Undated todos are not included.
  rpc ListPlannerEntries(ListPlannerEntriesRequest) returns (ListPlannerEntriesResponse) {
    option (google.api.http) = {get: "/api/v1/planner/entries"};
  }

  // GetWeekProgress reports how the caller's habit plan went, week by week:
  // the week containing `date` and, with `weeks`, the weeks before it. Weeks
  // start on the caller's planner setting (week_start_day), so they split the
  // same way as in the app. Each week is measured against one plan, the one in
  // effect on its last day, and a habit's count includes check-ins made by
  // completing habit todos, as the app's "2/3" does.
  //
  // It reports facts only: what was planned, what was checked in, and the
  // week's notes. Whether a week passed is for the caller to judge.
  rpc GetWeekProgress(GetWeekProgressRequest) returns (GetWeekProgressResponse) {
    option (google.api.http) = {get: "/api/v1/planner/weekProgress"};
  }

  // ListOpenTodos returns every active todo, dated or not, ordered by date with
  // undated ones last.
  rpc ListOpenTodos(ListOpenTodosRequest) returns (ListOpenTodosResponse) {
    option (google.api.http) = {get: "/api/v1/planner/openTodos"};
  }

  // ListTodoTags returns the tags used on the caller's todos, most recently
  // used first, to pick from when tagging a todo.
  rpc ListTodoTags(ListTodoTagsRequest) returns (ListTodoTagsResponse) {
    option (google.api.http) = {get: "/api/v1/planner/todoTags"};
  }

  // SetCheckIn records a check-in, or replaces the note of an existing one.
  // An archived habit takes no new check-ins.
  //
  // With `workout` set, it also records the workout the check-in stands for,
  // replacing any it had (an empty workout removes it); without, the workout
  // is kept. Calling it again with the same habit, date and content changes
  // nothing, so a caller can retry, and correct a workout by sending it whole.
  //
  // A caller with a personal access token (a bot) checks in as an agent. It
  // can change or remove only check-ins made by an agent; on one made in the
  // app it may only set the workout, and the note stays. If an open habit todo
  // of that habit is due that day, an agent's check-in completes it.
  rpc SetCheckIn(SetCheckInRequest) returns (CheckIn) {
    option (google.api.http) = {
      post: "/api/v1/planner/checkIns"
      body: "check_in"
    };
    option (google.api.method_signature) = "check_in";
  }

  // DeleteCheckIn removes a habit's check-in on a day. Removing one that does not
  // exist succeeds. A caller with a personal access token can remove only
  // check-ins made by an agent; removing one that completed a habit todo
  // reopens the todo.
  rpc DeleteCheckIn(DeleteCheckInRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/planner/checkIns"};
  }

  // ListWorkouts returns check-ins that carry a workout, newest first: to see
  // what was lifted last time, how often one trained this month, how weights
  // changed. It reports facts only.
  rpc ListWorkouts(ListWorkoutsRequest) returns (ListWorkoutsResponse) {
    option (google.api.http) = {get: "/api/v1/planner/workouts"};
  }

  // GetTodo returns one todo.
  rpc GetTodo(GetTodoRequest) returns (Todo) {
    option (google.api.http) = {get: "/api/v1/{name=planner/todos/*}"};
    option (google.api.method_signature) = "name";
  }

  // CreateTodo adds an active todo.
  rpc CreateTodo(CreateTodoRequest) returns (Todo) {
    option (google.api.http) = {
      post: "/api/v1/planner/todos"
      body: "todo"
    };
    option (google.api.method_signature) = "todo";
  }

  // UpdateTodo changes the fields named in update_mask. Changing `status` follows
  // the todo rules: closing records the close time and whether the todo was
  // already overdue (which needs local_date); cancelling needs a cancel_reason;
  // reopening clears all three.
  rpc UpdateTodo(UpdateTodoRequest) returns (Todo) {
    option (google.api.http) = {
      patch: "/api/v1/{todo.name=planner/todos/*}"
      body: "todo"
    };
    option (google.api.method_signature) = "todo,update_mask";
  }

  // PostponeTodo moves an active, dated todo to a later date. Unlike changing
  // the date through UpdateTodo (which corrects it), this keeps the original
  // date and counts the postponement.
  rpc PostponeTodo(PostponeTodoRequest) returns (Todo) {
    option (google.api.http) = {
      post: "/api/v1/{name=planner/todos/*}:postpone"
      body: "*"
    };
    option (google.api.method_signature) = "name,date";
  }

  // SetPlannedWorkout sets the workout planned for a habit on a day, on that
  // day's habit todo, replacing any plan it had; an empty workout clears it.
  // It is for agents: with no habit todo that day, it creates one (titled
  // after the habit) for a date from local_date on. The app sets a plan with
  // UpdateTodo instead.
  rpc SetPlannedWorkout(SetPlannedWorkoutRequest) returns (SetPlannedWorkoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/planner/plannedWorkouts"
      body: "*"
    };
  }

  // DeleteTodo deletes a todo. A personal access token may delete only the
  // todos an agent created.
  rpc DeleteTodo(DeleteTodoRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/{name=planner/todos/*}"};
    option (google.api.method_signature) = "name";
  }

  // GetPlannerNote returns one note.
  rpc GetPlannerNote(GetPlannerNoteRequest) returns (PlannerNote) {
    option (google.api.http) = {get: "/api/v1/{name=planner/notes/*}"};
    option (google.api.method_signature) = "name";
  }

  // CreatePlannerNote adds a note to a day.
  rpc CreatePlannerNote(CreatePlannerNoteRequest) returns (PlannerNote) {
    option (google.api.http) = {
      post: "/api/v1/planner/notes"
      body: "note"
    };
    option (google.api.method_signature) = "note";
  }

  // UpdatePlannerNote changes the fields named in update_mask.
  rpc UpdatePlannerNote(UpdatePlannerNoteRequest) returns (PlannerNote) {
    option (google.api.http) = {
      patch: "/api/v1/{note.name=planner/notes/*}"
      body: "note"
    };
    option (google.api.method_signature) = "note,update_mask";
  }

  // DeletePlannerNote deletes a note.
  rpc DeletePlannerNote(DeletePlannerNoteRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/{name=planner/notes/*}"};
    option (google.api.method_signature) = "name";
  }

  // GetPlannerSettings returns the caller's planner settings.
  rpc GetPlannerSettings(GetPlannerSettingsRequest) returns (PlannerSettings) {
    option (google.api.http) = {get: "/api/v1/planner/settings"};
  }

  // UpdatePlannerSettings replaces the caller's planner settings.
  rpc UpdatePlannerSettings(UpdatePlannerSettingsRequest) returns (PlannerSettings) {
    option (google.api.http) = {
      patch: "/api/v1/planner/settings"
      body: "settings"
    };
  }

  // ImportPlanner writes a whole planner in one transaction: the one-time backfill
  // from calendar blocks. It only runs into an empty planner and fails with
  // FAILED_PRECONDITION when the caller already has any planner data.
  rpc ImportPlanner(ImportPlannerRequest) returns (ImportPlannerResponse) {
    option (google.api.http) = {
      post: "/api/v1/planner:import"
      body: "*"
    };
  }
}

message Habit {
  option (google.api.resource) = {
    type: "memos.api.v1/Habit"
    pattern: "planner/habits/{habit}"
    singular: "habit"
    plural: "habits"
  };

  // Format: planner/habits/{habit}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // What the habit is, e.g. "💪运动".
  string title = 2 [(google.api.field_behavior) = REQUIRED];

  // Order among the caller's habits, ascending. It also picks the habit's colour
  // on the calendar.
  int32 position = 3 [(google.api.field_behavior) = OPTIONAL];

  // Deprecated: habit versions decide which habits are in use. Read only.
  bool archived = 4 [
    deprecated = true,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  google.protobuf.Timestamp create_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.protobuf.Timestamp update_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Index into the calendar palette, 0 to 7. The habit has this colour on every day.
  int32 color = 7 [(google.api.field_behavior) = OPTIONAL];
}

// HabitVersion is a habit plan. Enabled, it is the set of habits in use from
// effective_date on, until the next version: the habits that can be checked in,
// in calendar order. The draft has the same shape and no date.
message HabitVersion {
  // YYYY-MM-DD, the day it was enabled, or empty for "from the very beginning"
  // (and for the draft).
  string effective_date = 1;

  // At most five, each habit once, no two of the same colour.
  repeated HabitVersionEntry entries = 2;

  // The linked documents, in display order. Format: memos/{memo}
  repeated string memos = 5 [(google.api.field_behavior) = OPTIONAL];

  google.protobuf.Timestamp create_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.protobuf.Timestamp update_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message HabitVersionEntry {
  // Format: planner/habits/{habit}
  string habit = 1 [(google.api.field_behavior) = REQUIRED];

  // Check-ins a week the habit aims for, 0 to 7; 0 for none.
  int32 weekly_goal = 2 [(google.api.field_behavior) = OPTIONAL];

  // Pinned habits show on the planner page and in the calendar's day cells;
  // the others fold behind one button. At most three per plan.
  bool pinned = 3 [(google.api.field_behavior) = OPTIONAL];
}

// CheckIn records that a habit was kept on a day. There is at most one per
// habit per day, so it is addressed by the pair rather than by its own name.
message CheckIn {
  // The habit. Format: planner/habits/{habit}
  string habit = 1 [(google.api.field_behavior) = REQUIRED];

  // Format: YYYY-MM-DD.
  string date = 2 [(google.api.field_behavior) = REQUIRED];

  // A short remark, e.g. how far one ran.
  string note = 3 [(google.api.field_behavior) = OPTIONAL];

  // The todo whose completion made this check-in, or empty for one checked in
  // by hand. Such a check-in belongs to the todo: it cannot be changed or
  // removed on its own, only with the todo. Format: planner/todos/{todo}
  string todo = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Who made a check-in. The server works it out from the caller's
  // credential; a caller cannot choose it.
  enum Source {
    SOURCE_UNSPECIFIED = 0;
    // In the app.
    MANUAL = 1;
    // By completing a habit todo in the app.
    TODO = 2;
    // By a caller with a personal access token, e.g. a bot.
    AGENT = 3;
  }

  Source source = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The workout the check-in stands for: one session of the habit that day.
  // Unset for a check-in without one.
  Workout workout = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Workout is the detail of a workout a check-in stands for. It records facts
// as reported; it does not judge whether the session counts.
message Workout {
  // The whole session's length in minutes; unset when not recorded.
  optional double duration_minutes = 1 [(google.api.field_behavior) = OPTIONAL];

  // The exercises in the order they were done, at most 30.
  repeated WorkoutExercise exercises = 2 [(google.api.field_behavior) = OPTIONAL];
}

message WorkoutExercise {
  // What was done, e.g. "Romanian deadlift".
  string name = 1 [(google.api.field_behavior) = REQUIRED];

  // What it was done with, e.g. "dumbbells".
  string equipment = 2 [(google.api.field_behavior) = OPTIONAL];

  // In kilograms; the caller converts from pounds.
  optional double weight_kg = 3 [(google.api.field_behavior) = OPTIONAL];

  // Repetitions of each set, in order, e.g. [15, 12, 12].
  repeated int32 reps = 4 [(google.api.field_behavior) = OPTIONAL];

  // In minutes, for timed exercises.
  optional double duration_minutes = 5 [(google.api.field_behavior) = OPTIONAL];

  // The machine's settings, e.g. "incline 10, 3.8-4 km/h".
  string settings = 6 [(google.api.field_behavior) = OPTIONAL];

  // A remark in a sentence.
  string note = 7 [(google.api.field_behavior) = OPTIONAL];

  // The exercise's guide in the exercise library: a document of the caller's
  // with `kind: exercise` in its frontmatter. It is what identifies the
  // exercise, so the same one keeps its identity however the name is written
  // each time. Empty for an exercise outside the library, e.g. a warm-up walk.
  // A write must name an existing, unarchived document of the caller's, except
  // one the stored workout already carries: a guide archived later stays.
  // Format: memos/{memo}
  string doc = 8 [(google.api.field_behavior) = OPTIONAL];

  // How hard it was, in words, e.g. "moderate" or "RPE 7".
  string intensity = 9 [(google.api.field_behavior) = OPTIONAL];
}

message Todo {
  option (google.api.resource) = {
    type: "memos.api.v1/Todo"
    pattern: "planner/todos/{todo}"
    singular: "todo"
    plural: "todos"
  };

  // There is no "overdue" status: an active todo whose date is before the
  // user's local today is overdue, and only the client knows that date.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    ACTIVE = 1;
    DONE = 2;
    CANCELLED = 3;
  }

  // Format: planner/todos/{todo}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  string title = 2 [(google.api.field_behavior) = REQUIRED];

  // The day the todo is planned for, YYYY-MM-DD, or empty for none.
  string date = 3 [(google.api.field_behavior) = OPTIONAL];

  Status status = 4 [(google.api.field_behavior) = OPTIONAL];

  // Whether the todo was closed after its date had passed.
  bool closed_overdue = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the todo was closed. Unset while active, and for imported todos.
  google.protobuf.Timestamp close_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Why the todo was cancelled. Required to cancel.
  string cancel_reason = 7 [(google.api.field_behavior) = OPTIONAL];

  bool important = 8 [(google.api.field_behavior) = OPTIONAL];

  // A free-form tag.
  string tag = 9 [(google.api.field_behavior) = OPTIONAL];

  string note = 10 [(google.api.field_behavior) = OPTIONAL];

  // Deprecated: use memos. Read as the first of memos; written (update mask path
  // "memo") as the only linked document.
  string memo = 11 [
    deprecated = true,
    (google.api.field_behavior) = OPTIONAL
  ];

  // A linked external page.
  string url = 12 [(google.api.field_behavior) = OPTIONAL];

  google.protobuf.Timestamp create_time = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.protobuf.Timestamp update_time = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The date before the todo's first postponement, or empty if it was never
  // postponed. Set by PostponeTodo.
  string original_date = 15 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many times the todo has been postponed. Set by PostponeTodo.
  int32 postpone_count = 16 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The linked documents, in display order. Format: memos/{memo}
  repeated string memos = 17 [(google.api.field_behavior) = OPTIONAL];

  // For a habit todo, the habit it checks in on its date when done; empty for a
  // plain todo. Set only at creation, and cleared when a version drops the habit.
  // Format: planner/habits/{habit}
  string habit = 18 [(google.api.field_behavior) = OPTIONAL];

  // The day of the check-in the todo's completion made, YYYY-MM-DD, or empty for
  // none. A todo with one can no longer be reopened, cancelled or relinked, only
  // deleted, which removes the check-in too.
  string check_in_date = 19 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Who created the todo or set its planned workout, decided from the
  // caller's credential.
  enum Source {
    SOURCE_UNSPECIFIED = 0;
    // In the app.
    MANUAL = 1;
    // By a caller with a personal access token, e.g. a bot.
    AGENT = 2;
  }

  // Who created the todo. A personal access token may delete only the todos an
  // agent created.
  Source source = 20 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The workout planned for a habit todo's day: what to do, where a check-in's
  // workout records what was done. Reps are target counts. Only habit todos
  // carry one; written with update mask path "planned_workout", where an empty
  // workout clears it.
  Workout planned_workout = 21 [(google.api.field_behavior) = OPTIONAL];

  // Who last set planned_workout; unspecified when there is none.
  Source planned_workout_source = 22 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// PlannerNote is a plain record of what happened on a day.
message PlannerNote {
  option (google.api.resource) = {
    type: "memos.api.v1/PlannerNote"
    pattern: "planner/notes/{note}"
    singular: "plannerNote"
    plural: "plannerNotes"
  };

  // Format: planner/notes/{note}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Format: YYYY-MM-DD.
  string date = 2 [(google.api.field_behavior) = REQUIRED];

  string content = 3 [(google.api.field_behavior) = REQUIRED];

  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.protobuf.Timestamp update_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // A longer remark, shown only on the note's own page.
  string remark = 6 [(google.api.field_behavior) = OPTIONAL];

  // Linked documents, "memos/{uid}", in display order.
  repeated string memos = 7 [(google.api.field_behavior) = OPTIONAL];
}

message ListHabitsRequest {}

message ListHabitVersionsRequest {}

message ListHabitVersionsResponse {
  repeated HabitVersion versions = 1;

  // The plan not yet enabled; unset when there is none.
  HabitVersion draft = 2;
}

message UpdateHabitDraftRequest {
  // effective_date is ignored: a draft takes the day it is enabled.
  HabitVersion draft = 1 [(google.api.field_behavior) = REQUIRED];
}

message DeleteHabitDraftRequest {}

message EnableHabitDraftRequest {
  // The caller's local date, YYYY-MM-DD: the version takes effect on it.
  string local_date = 1 [(google.api.field_behavior) = REQUIRED];

  // Must be set when the draft drops a habit that still has open habit todos
  // from local_date on: those become plain todos.
  bool unlink_todos = 2 [(google.api.field_behavior) = OPTIONAL];
}

message ListHabitsResponse {
  repeated Habit habits = 1;
}

message CreateHabitRequest {
  Habit habit = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateHabitRequest {
  Habit habit = 1 [(google.api.field_behavior) = REQUIRED];

  // Supported paths: title, color, position.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

message ListPlannerEntriesRequest {
  // First day of the range, inclusive. Format: YYYY-MM-DD.
  string start_date = 1 [(google.api.field_behavior) = REQUIRED];

  // Last day of the range, inclusive. Format: YYYY-MM-DD.
  string end_date = 2 [(google.api.field_behavior) = REQUIRED];
}

message ListPlannerEntriesResponse {
  repeated CheckIn check_ins = 1;

  repeated Todo todos = 2;

  repeated PlannerNote notes = 3;
}

message ListOpenTodosRequest {}

message ListOpenTodosResponse {
  repeated Todo todos = 1;
}

message ListTodoTagsRequest {}

message ListTodoTagsResponse {
  // Most recently used first; at most 50.
  repeated string tags = 1;
}

message SetCheckInRequest {
  CheckIn check_in = 1 [(google.api.field_behavior) = REQUIRED];
}

message DeleteCheckInRequest {
  // Format: planner/habits/{habit}
  string habit = 1 [(google.api.field_behavior) = REQUIRED];

  // Format: YYYY-MM-DD.
  string date = 2 [(google.api.field_behavior) = REQUIRED];
}

message ListWorkoutsRequest {
  // Inclusive bounds, YYYY-MM-DD; either may be empty for no bound.
  string start_date = 1 [(google.api.field_behavior) = OPTIONAL];
  string end_date = 2 [(google.api.field_behavior) = OPTIONAL];

  // Only this habit's workouts. Format: planner/habits/{habit}
  string habit = 3 [(google.api.field_behavior) = OPTIONAL];

  // Only workouts with an exercise whose name contains this text, ignoring
  // case, e.g. "deadlift" for the last times one did deadlifts.
  string exercise = 4 [(google.api.field_behavior) = OPTIONAL];

  // At most this many, the newest: 1 to 200, 50 when unset.
  int32 limit = 5 [(google.api.field_behavior) = OPTIONAL];

  // Only workouts with an exercise linked to this exercise guide. Unlike
  // exercise, it does not depend on how the name was written. Format:
  // memos/{memo}
  string doc = 6 [(google.api.field_behavior) = OPTIONAL];
}

message ListWorkoutsResponse {
  // Check-ins that carry a workout, newest first.
  repeated CheckIn check_ins = 1;
}

message GetTodoRequest {
  // Format: planner/todos/{todo}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message CreateTodoRequest {
  Todo todo = 1 [(google.api.field_behavior) = REQUIRED];

  // The caller's local date, YYYY-MM-DD. Required for a habit todo, which can be
  // for today or later only.
  string local_date = 2 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateTodoRequest {
  Todo todo = 1 [(google.api.field_behavior) = REQUIRED];

  // Supported paths: title, date, status, cancel_reason, important, tag, note,
  // memos, url, and the deprecated memo. A habit todo keeps its date.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];

  // The caller's local date, YYYY-MM-DD. Required when closing a todo: whether it
  // was closed overdue depends on the user's day, not the server's. A habit todo
  // can be completed on its date or after (a late check-in), never before.
  string local_date = 3 [(google.api.field_behavior) = OPTIONAL];
}

message PostponeTodoRequest {
  // Format: planner/todos/{todo}
  string name = 1 [(google.api.field_behavior) = REQUIRED];

  // The new date, YYYY-MM-DD. Must differ from the current one and not be
  // before local_date.
  string date = 2 [(google.api.field_behavior) = REQUIRED];

  // The caller's local date, YYYY-MM-DD.
  string local_date = 3 [(google.api.field_behavior) = REQUIRED];
}

message SetPlannedWorkoutRequest {
  // Format: planner/habits/{habit}
  string habit = 1 [(google.api.field_behavior) = REQUIRED];

  // The day of the habit todo. Format: YYYY-MM-DD.
  string date = 2 [(google.api.field_behavior) = REQUIRED];

  // The caller's today, YYYY-MM-DD: a new habit todo is for a date from this
  // day on.
  string local_date = 3 [(google.api.field_behavior) = REQUIRED];

  // The whole plan; an empty one clears it.
  Workout workout = 4 [(google.api.field_behavior) = OPTIONAL];
}

message SetPlannedWorkoutResponse {
  // The habit todo, with its plan. Unset when clearing a plan on a day with no
  // habit todo.
  Todo todo = 1;

  // Whether this call created the todo.
  bool created = 2;
}

message DeleteTodoRequest {
  // Format: planner/todos/{todo}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetPlannerNoteRequest {
  // Format: planner/notes/{note}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message CreatePlannerNoteRequest {
  PlannerNote note = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdatePlannerNoteRequest {
  PlannerNote note = 1 [(google.api.field_behavior) = REQUIRED];

  // Supported paths: date, content, remark, memos.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

message DeletePlannerNoteRequest {
  // Format: planner/notes/{note}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message ImportPlannerRequest {
  // Habits in calendar order. Their names are ignored; new ones are assigned.
  repeated Habit habits = 1;

  // Check-ins naming their habit by index into `habits`.
  repeated ImportCheckIn check_ins = 2;

  // Todos with their final status. Names are ignored. A closed todo may set
  // closed_overdue, which is otherwise output only.
  repeated ImportTodo todos = 3;

  // Notes. Names are ignored.
  repeated PlannerNote notes = 4;
}

message ImportCheckIn {
  // Index into ImportPlannerRequest.habits.
  int32 habit_index = 1;

  // Format: YYYY-MM-DD.
  string date = 2;

  string note = 3;
}

message ImportTodo {
  Todo todo = 1;

  // Whether the todo was closed after its date had passed.
  bool closed_overdue = 2;
}

message ImportPlannerResponse {
  int32 habit_count = 1;

  int32 check_in_count = 2;

  int32 todo_count = 3;

  int32 note_count = 4;
}

// PlannerSettings are the caller's planner preferences kept on the server, so
// every device and every API caller see the same ones.
message PlannerSettings {
  // The day planner weeks start on: 1 = Monday … 7 = Sunday, or 0 to follow
  // the instance's week start.
  int32 week_start_day = 1 [(google.api.field_behavior) = OPTIONAL];
}

message GetPlannerSettingsRequest {}

message UpdatePlannerSettingsRequest {
  PlannerSettings settings = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetWeekProgressRequest {
  // The caller's local today, YYYY-MM-DD. Its week comes first.
  string date = 1 [(google.api.field_behavior) = REQUIRED];

  // How many weeks to return, counting back from the week of `date`: 1 to 12.
  // 1 when unset.
  int32 weeks = 2 [(google.api.field_behavior) = OPTIONAL];
}

message GetWeekProgressResponse {
  // The day weeks start on, 1 = Monday … 7 = Sunday: the caller's planner
  // setting, or the instance's week start when the setting follows it.
  int32 week_start_day = 1;

  // The week of `date` first, then each week before it.
  repeated WeekProgress weeks = 2;
}

// WeekProgress is one week of a habit plan: what was planned and what was done.
message WeekProgress {
  // First and last day of the week, YYYY-MM-DD.
  string week_start = 1;
  string week_end = 2;

  // Whether the request's `date` falls in this week.
  bool contains_date = 3;

  // Days left in the week counting `date` itself; 0 for an earlier week.
  int32 days_left = 4;

  // The plan the week is measured against: the one in effect on its last day.
  // Unset for a week before the first plan.
  WeekPlan plan = 5;

  // The plan's habits in plan order, then any other habit checked in during
  // the week.
  repeated WeekHabitProgress habits = 6;

  // The week's habit todos, by date.
  repeated WeekHabitTodo habit_todos = 7;

  // The week's notes, by date.
  repeated WeekNote notes = 8;
}

// WeekPlan is a habit plan (a habit version). Plans have no names: the app
// labels one by the day it took effect.
message WeekPlan {
  // The day the plan took effect, YYYY-MM-DD, or empty for the plan in effect
  // from the very beginning.
  string effective_date = 1;

  // When the plan changed during the week: the effective dates of the plans
  // in effect earlier in the week, earliest first ("" for the very first).
  // The whole week is still measured against this plan, the last one.
  repeated string replaced = 2;

  // The plan's linked documents, in display order.
  repeated WeekPlanDocument documents = 3;
}

message WeekPlanDocument {
  // Format: memos/{memo}
  string name = 1;

  // The document's title; empty when the caller cannot read it.
  string title = 2;
}

message WeekHabitProgress {
  // Format: planner/habits/{habit}
  string habit = 1;

  // The habit's icon: the emoji its title starts with.
  string icon = 2;

  // The rest of the title, possibly empty.
  string label = 3;

  // Whether the week's plan includes the habit.
  bool in_plan = 4;

  // Check-ins a week the plan aims for. Unset when the plan sets no goal for
  // the habit, or does not include it.
  optional int32 weekly_goal = 5;

  // How many days of the week the habit was checked in, by hand or by
  // completing a habit todo. Can exceed weekly_goal.
  int32 check_in_count = 6;

  // The check-ins, by date.
  repeated WeekCheckIn check_ins = 7;
}

message WeekCheckIn {
  // Format: YYYY-MM-DD.
  string date = 1;

  string note = 2;

  // The todo whose completion made the check-in, or empty for one checked in
  // by hand. Format: planner/todos/{todo}
  string todo = 3;

  // Who made the check-in.
  CheckIn.Source source = 4;

  // The workout the check-in stands for; unset for none.
  Workout workout = 5;
}

// WeekNote is a note written on a day of the week, e.g. that one was ill or away.
message WeekNote {
  // Format: YYYY-MM-DD.
  string date = 1;

  string content = 2;
}

message WeekHabitTodo {
  enum State {
    STATE_UNSPECIFIED = 0;
    // Not done yet, and its day is today or later.
    ACTIVE = 1;
    // Done on its day, which checked in its habit.
    DONE = 2;
    // Its day passed without it being done.
    FAILED = 3;
    CANCELLED = 4;
  }

  // Format: planner/todos/{todo}
  string name = 1;

  // Format: YYYY-MM-DD.
  string date = 2;

  string title = 3;

  // Format: planner/habits/{habit}
  string habit = 4;

  // Worked out against the request's `date` as today.
  State state = 5;

  // Who created the todo.
  Todo.Source source = 6;

  // The workout planned for the day, if any.
  Workout planned_workout = 7;

  // Who last set planned_workout; unspecified when there is none.
  Todo.Source planned_workout_source = 8;
}
