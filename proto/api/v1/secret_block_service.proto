syntax = "proto3";

package memos.api.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "gen/api/v1";

// SecretBlockService stores the ciphertext behind `toucan-secret` fenced blocks.
//
// The server is a dumb vault: it never sees plaintext and never sees the user's
// passphrase. Encryption and decryption happen entirely in the browser, so there
// is deliberately no RPC here that could return plaintext — not even for debugging.
//
// A secret block belongs to the user who created it, NOT to the document that
// references it. Documents reference a secret by uid from their markdown body; a
// secret is never deleted as a side effect of deleting or copying a document.
service SecretBlockService {
  // ListSecretBlocks returns the caller's secret blocks as metadata only.
  //
  // This intentionally does NOT return ciphertext. The management UI only needs
  // hints and timestamps, and bulk-shipping ciphertext would hand an attacker a
  // ready-made offline brute-force corpus. Ciphertext is fetched one record at a
  // time via GetSecretBlock.
  rpc ListSecretBlocks(ListSecretBlocksRequest) returns (ListSecretBlocksResponse) {
    option (google.api.http) = {get: "/api/v1/secretBlocks"};
  }

  // GetSecretBlock returns one secret block including its ciphertext envelope.
  // Callers must own the record. Responses are sent with `Cache-Control: no-store`
  // so ciphertext does not linger in the browser's disk cache.
  rpc GetSecretBlock(GetSecretBlockRequest) returns (SecretBlock) {
    option (google.api.http) = {get: "/api/v1/{name=secretBlocks/*}"};
    option (google.api.method_signature) = "name";
  }

  // CreateSecretBlock stores a client-encrypted envelope and returns the record,
  // whose uid the client then writes into the document body.
  rpc CreateSecretBlock(CreateSecretBlockRequest) returns (SecretBlock) {
    option (google.api.http) = {
      post: "/api/v1/secretBlocks"
      body: "secret_block"
    };
    option (google.api.method_signature) = "secret_block";
  }

  // UpdateSecretBlock replaces a record's envelope in place. This is how changing
  // a passphrase works, and replacing rather than appending is the whole reason
  // ciphertext lives here instead of inline in the document: a superseded envelope
  // leaves no copy behind in memo history or git.
  rpc UpdateSecretBlock(UpdateSecretBlockRequest) returns (SecretBlock) {
    option (google.api.http) = {
      patch: "/api/v1/{secret_block.name=secretBlocks/*}"
      body: "secret_block"
    };
    option (google.api.method_signature) = "secret_block";
  }

  // DeleteSecretBlock permanently destroys a record. There is no recovery, and no
  // caller other than the user acting deliberately ever invokes this — deleting or
  // duplicating a document leaves its referenced secrets untouched.
  //
  // A restricted block cannot be deleted directly: deleting it is the same as
  // lifting its restriction, so the restriction has to be lifted first (which
  // waits like any other policy change). Fails with FAILED_PRECONDITION otherwise.
  rpc DeleteSecretBlock(DeleteSecretBlockRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/{name=secretBlocks/*}"};
    option (google.api.method_signature) = "name";
  }

  // GetSecretBlockSummary returns one block without its envelope. It is how a
  // restricted block learns its unlock state without spending a viewing window:
  // GetSecretBlock on a restricted block starts the window the first time it
  // succeeds.
  rpc GetSecretBlockSummary(GetSecretBlockSummaryRequest) returns (SecretBlockSummary) {
    option (google.api.http) = {get: "/api/v1/{name=secretBlocks/*}:summary"};
    option (google.api.method_signature) = "name";
  }

  // RequestSecretBlockUnlock asks for a restricted block's envelope to become
  // available. The server checks the typed confirmation text and computes when
  // the block opens from the block's policy and the server clock — the client
  // has no say in either. See docs/dev/requirements/editor/restricted-secret-block.md.
  rpc RequestSecretBlockUnlock(RequestSecretBlockUnlockRequest) returns (SecretBlockSummary) {
    option (google.api.http) = {
      post: "/api/v1/{name=secretBlocks/*}:requestUnlock"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // CancelSecretBlockUnlock withdraws a request that is still waiting.
  rpc CancelSecretBlockUnlock(CancelSecretBlockUnlockRequest) returns (SecretBlockSummary) {
    option (google.api.http) = {
      post: "/api/v1/{name=secretBlocks/*}:cancelUnlock"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // UpdateSecretBlockPolicy restricts a block, changes its policy, or lifts the
  // restriction (an unset policy). Restricting an unrestricted block applies
  // immediately; every change to an already restricted block — tighter or looser —
  // is scheduled and takes effect only after the block's normal unlock delay.
  rpc UpdateSecretBlockPolicy(UpdateSecretBlockPolicyRequest) returns (SecretBlockSummary) {
    option (google.api.http) = {
      post: "/api/v1/{name=secretBlocks/*}:updatePolicy"
      body: "*"
    };
    option (google.api.method_signature) = "name,policy";
  }

  // CancelSecretBlockPolicyChange withdraws a scheduled policy change.
  rpc CancelSecretBlockPolicyChange(CancelSecretBlockPolicyChangeRequest) returns (SecretBlockSummary) {
    option (google.api.http) = {
      post: "/api/v1/{name=secretBlocks/*}:cancelPolicyChange"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
}

// SecretEnvelope is everything needed to decrypt a secret given the passphrase,
// and nothing that helps without it. The server treats every field as opaque.
message SecretEnvelope {
  // The key derivation function. Currently always "pbkdf2-sha256".
  //
  // Stored per record rather than assumed, so a future suite (argon2id) can be
  // introduced without migrating existing records: each envelope is decrypted
  // with the parameters it was written with.
  string kdf = 1 [(google.api.field_behavior) = REQUIRED];

  // Iteration count for the KDF.
  int32 kdf_iterations = 2 [(google.api.field_behavior) = REQUIRED];

  // The AEAD cipher. Currently always "aes-256-gcm".
  string cipher = 3 [(google.api.field_behavior) = REQUIRED];

  // Base64 KDF salt.
  string salt = 4 [(google.api.field_behavior) = REQUIRED];

  // Base64 AEAD nonce.
  string nonce = 5 [(google.api.field_behavior) = REQUIRED];

  // Base64 HMAC over the canonical parameter header, keyed by a passphrase-derived
  // MAC key. Lets the client tell a wrong passphrase from a corrupted ciphertext:
  // AEAD authentication failure alone cannot distinguish the two, and a user who
  // hit corruption needs to know to go find a backup instead of retrying passwords.
  string verifier = 6 [(google.api.field_behavior) = REQUIRED];

  // Base64 AEAD ciphertext, with the authentication tag appended.
  string ciphertext = 7 [(google.api.field_behavior) = REQUIRED];
}

message SecretBlock {
  option (google.api.resource) = {
    type: "memos.api.v1/SecretBlock"
    pattern: "secretBlocks/{secret_block}"
    singular: "secretBlock"
    plural: "secretBlocks"
  };

  // The resource name of the secret block.
  // Format: secretBlocks/{secret_block}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // A user-authored label for which passphrase unlocks this block (e.g.
  // "minio-prod"). Stored and displayed in clear text — it is a reminder, not a
  // secret, and it is what makes one passphrase usable across several blocks.
  string hint = 2 [(google.api.field_behavior) = OPTIONAL];

  // The client-encrypted payload.
  SecretEnvelope envelope = 3 [(google.api.field_behavior) = REQUIRED];

  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.protobuf.Timestamp update_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Present only for a restricted block. See SecretBlockRestriction.
  SecretBlockRestriction restriction = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// SecretBlockSummary is SecretBlock without the envelope. It is a separate message
// rather than a partially-populated SecretBlock so that no future edit to the list
// handler can accidentally start returning ciphertext.
message SecretBlockSummary {
  // Format: secretBlocks/{secret_block}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  string hint = 2 [(google.api.field_behavior) = OPTIONAL];

  // Byte length of the stored ciphertext, so the management UI can show a size
  // without transferring the ciphertext itself.
  int64 ciphertext_size = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.protobuf.Timestamp update_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Present only for a restricted block.
  SecretBlockRestriction restriction = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// SecretBlockPolicy is the time gate in front of a restricted block. It guards
// against the owner's own impulses (the 1 a.m. "I'll just unlock it now"), not
// against an attacker: the gate is enforced by the server so that skipping it
// costs more than waiting, but an administrator can always bypass it.
//
// Clients choose a preset and write the two texts; every number is filled in by
// the server from the preset and returned for display.
message SecretBlockPolicy {
  enum Preset {
    PRESET_UNSPECIFIED = 0;
    // Waits until the next release time whenever the request is made. No
    // emergency path. For keys whose absence only postpones something.
    LOW_IMPACT = 1;
    // Short wait inside working hours, until the next release time outside them,
    // plus a rate-limited emergency path. For keys whose absence can block work.
    HIGH_IMPACT = 2;
  }

  Preset preset = 1 [(google.api.field_behavior) = REQUIRED];

  // IANA time zone the wall-clock times below are read in (e.g. "Asia/Shanghai").
  // Stored with the policy rather than taken from the server process, whose zone
  // is often UTC in a container.
  string time_zone = 2 [(google.api.field_behavior) = REQUIRED];

  // Shown before every unlock request: a note from the owner to their future self.
  string prompt = 3 [(google.api.field_behavior) = OPTIONAL];

  // Must be typed verbatim (modulo surrounding and repeated whitespace) to request
  // an unlock. Not a secret.
  string confirm_text = 4 [(google.api.field_behavior) = REQUIRED];

  // Working hours as minutes after local midnight, [start, end). Both zero when
  // the preset has no working-hours fast path.
  int32 work_start_minute = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  int32 work_end_minute = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Wait for a request made inside working hours.
  int32 work_delay_seconds = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Local minute of day a request made outside working hours opens at: the first
  // such time strictly after the request.
  int32 release_minute = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Emergency unlocks allowed per rolling window. Zero means no emergency path.
  int32 emergency_quota = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  int32 emergency_window_days = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How long the envelope is served once first fetched.
  int32 view_seconds = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How long an available but unviewed request stays available.
  int32 ready_ttl_seconds = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// SecretBlockRestriction is a restricted block's policy and where it currently
// stands. All times come from the server clock.
message SecretBlockRestriction {
  enum UnlockState {
    UNLOCK_STATE_UNSPECIFIED = 0;
    // No live request. GetSecretBlock fails.
    LOCKED = 1;
    // Requested; opens at available_time. GetSecretBlock fails.
    PENDING = 2;
    // Open for viewing until expire_time; the window has not started yet. The
    // first GetSecretBlock starts it.
    READY = 3;
    // The viewing window is running until expire_time. GetSecretBlock succeeds.
    OPEN = 4;
  }

  SecretBlockPolicy policy = 1;

  UnlockState unlock_state = 2;

  // Whether the live request (if any) came through the emergency path.
  bool emergency = 3;

  // PENDING: when the block opens.
  google.protobuf.Timestamp available_time = 4;

  // READY: when an unviewed request lapses. OPEN: when the viewing window ends.
  google.protobuf.Timestamp expire_time = 5;

  // Emergency unlocks left in the current window.
  int32 emergency_remaining = 6;

  // When the next emergency unlock frees up, if none remain.
  google.protobuf.Timestamp next_emergency_time = 7;

  // The most recent emergency unlock, kept visible so it is seen the morning after.
  google.protobuf.Timestamp last_emergency_time = 8;
  string last_emergency_reason = 9;

  // A scheduled policy change, if any.
  SecretBlockPendingPolicyChange pending_change = 10;
}

message SecretBlockPendingPolicyChange {
  // The policy that will apply. Unset means the restriction will be lifted.
  SecretBlockPolicy policy = 1;

  google.protobuf.Timestamp effective_time = 2;
}

message ListSecretBlocksRequest {}

message ListSecretBlocksResponse {
  // The caller's secret blocks, newest first. Metadata only — never ciphertext.
  repeated SecretBlockSummary secret_blocks = 1;
}

message GetSecretBlockRequest {
  // Required. Format: secretBlocks/{secret_block}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/SecretBlock"}
  ];
}

message CreateSecretBlockRequest {
  // Required. The secret block to create. `name` is assigned by the server.
  SecretBlock secret_block = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. Creates the block already restricted. Restricting only ever makes
  // the secret harder to reach, so it applies immediately.
  SecretBlockPolicy policy = 2 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateSecretBlockRequest {
  // Required. The secret block to update. Both `hint` and `envelope` are replaced
  // wholesale; there is no field mask, because a partially-updated envelope would
  // be permanently undecryptable.
  SecretBlock secret_block = 1 [(google.api.field_behavior) = REQUIRED];
}

message DeleteSecretBlockRequest {
  // Required. Format: secretBlocks/{secret_block}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/SecretBlock"}
  ];
}

message GetSecretBlockSummaryRequest {
  // Required. Format: secretBlocks/{secret_block}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/SecretBlock"}
  ];
}

message RequestSecretBlockUnlockRequest {
  // Required. Format: secretBlocks/{secret_block}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/SecretBlock"}
  ];

  // Required. The policy's confirm_text, typed by hand.
  string confirm_text = 2 [(google.api.field_behavior) = REQUIRED];

  // Skip the wait. Only for presets with an emergency quota, and only while the
  // quota lasts. Requires emergency_text and emergency_reason.
  bool emergency = 3 [(google.api.field_behavior) = OPTIONAL];

  // The fixed emergency statement, typed by hand.
  string emergency_text = 4 [(google.api.field_behavior) = OPTIONAL];

  // Why this cannot wait. Kept and shown on the block afterwards.
  string emergency_reason = 5 [(google.api.field_behavior) = OPTIONAL];
}

message CancelSecretBlockUnlockRequest {
  // Required. Format: secretBlocks/{secret_block}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/SecretBlock"}
  ];
}

message UpdateSecretBlockPolicyRequest {
  // Required. Format: secretBlocks/{secret_block}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/SecretBlock"}
  ];

  // The new policy. Unset lifts the restriction.
  SecretBlockPolicy policy = 2 [(google.api.field_behavior) = OPTIONAL];
}

message CancelSecretBlockPolicyChangeRequest {
  // Required. Format: secretBlocks/{secret_block}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/SecretBlock"}
  ];
}
