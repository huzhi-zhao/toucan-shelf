syntax = "proto3";

package memos.store;

option go_package = "gen/store";

message MemoPayload {
  Property property = 1;

  Location location = 2;

  repeated string tags = 3;

  // Set when this memo is a comment anchored to a location within a PDF attachment.
  PdfAnnotation pdf_annotation = 4;

  // Set when this memo is a comment anchored to a heading within a document memo.
  DocAnchor doc_anchor = 5;

  // Supplementary per-node data keyed by an in-document node anchor id (e.g. a
  // `sheets` block's `id:`). The value is an opaque JSON string whose shape is
  // owned by the node's renderer; the server never parses it. Lets clients
  // attach overlay info (cell styles, etc.) to any addressable node without
  // touching that node's raw content.
  map<string, string> node_overlays = 6;

  // Set when this memo is a comment anchored to a text range within an EPUB attachment.
  EpubAnnotation epub_annotation = 7;

  // How this document is framed by the app: body width, outline, folder tree,
  // properties panel. Deliberately NOT stored in the document's frontmatter —
  // frontmatter carries content semantics (date, status, tags), while this is
  // chrome that only means anything inside this app and so has no business
  // travelling with the exported markdown. Storing it here also keeps toggling
  // a view knob from rewriting the content: no new revision, no updated_ts
  // bump, no memogit diff, and no re-embedding (see updateAffectsIndex).
  DocConfig doc_config = 8;

  // Whether the current content was written by an agent over the MCP channel.
  // Cleared on every human write.
  //
  // Decides whether an agent write must first snapshot the human baseline: if
  // the content it is about to overwrite is human-authored, that state is
  // captured as a version first; if the agent is overwriting its own earlier
  // output, it is not. Snapshot count therefore tracks human editing sessions,
  // not agent iterations.
  //
  // The false zero value is the safe direction: an old memo without the field,
  // or one whose payload lost it, degrades to "take a snapshot on the next
  // agent write" — one redundant version, never lost content.
  //
  // NOT a lock. Do not reuse it for concurrency control: its lifetime is "true
  // until a human edits", which as a lock means an agent holds it forever and
  // the only thing that can release it is the very action it blocks. See
  // docs/plans/2026-07-31-mcp-agent-authoring/requirement.md ADR-6.
  bool agent_session_open = 9;

  // The calculated properties from the memo content.
  message Property {
    bool has_link = 1;
    bool has_task_list = 2;
    bool has_code = 3;
    bool has_incomplete_tasks = 4;
    // The title extracted from the first H1 heading, if present.
    string title = 5;
  }

  message Location {
    string placeholder = 1;
    double latitude = 2;
    double longitude = 3;
  }

  // Per-document view configuration. Every field uses explicit presence: unset
  // means "never configured" and falls back to the app default (or, for now, to
  // the deprecated frontmatter key), which is NOT the same as an explicit false.
  // `full_width` in particular defaults to true, so a bare `bool` would make the
  // two indistinguishable.
  message DocConfig {
    // Whether the document body spans the full width of its pane. Default true.
    optional bool full_width = 1;
    // Whether the outline panel opens by default (desktop only). Default true.
    optional bool display_outline = 2;
    // Whether the left secondary sidebar (folder tree) stays expanded while this
    // document is open. Default true.
    optional bool display_filter = 3;
    // Whether the frontmatter properties panel renders above the body. Default true.
    optional bool show_properties = 4;
  }

  message PdfAnnotation {
    // The name of the attachment this annotation is anchored to, e.g. "attachments/{uid}".
    string attachment_name = 1;
    // 1-based page number.
    int32 page = 2;
    // Normalized (0~1) rect relative to the unrotated page dimensions.
    double x = 3;
    double y = 4;
    double width = 5;
    double height = 6;
    // Optional selected text snippet, used as a fallback anchor if the rect drifts.
    string text_snippet = 7;
    // The exact marked text from the page's rendered text layer. Empty means the
    // annotation has no text-level anchor and draws from the rect alone (the only
    // option for scanned PDFs, which have no selectable text). See the api/v1
    // PdfAnnotation for why this mirrors DocAnchor's quote selector.
    string text_exact = 8;
    // Bounded windows of rendered text surrounding `text_exact`, used to disambiguate
    // a phrase that repeats on the same page.
    string text_prefix = 9;
    string text_suffix = 10;
    // The mark's color preset key (e.g. "yellow"). Empty means no fill.
    string color = 11;
    // Render as an underline rather than a background highlight.
    bool underline = 12;
  }

  // Anchors a comment to a location inside a document memo's own content. The heading
  // fields always identify the enclosing section; the optional text_* fields additionally
  // pin an exact span of rendered text so the comment renders as an in-text mark. See
  // the api/v1 DocAnchor for why the span is stored as a quote selector, not offsets.
  message DocAnchor {
    // The slug (DOM id) of the heading this comment is anchored to. Empty means the
    // comment is anchored to the top of the document (no preceding heading).
    string heading_slug = 1;
    // The heading's display text, shown as the comment's anchor label.
    string heading_text = 2;
    // The exact marked text. Empty means the comment has no text-level anchor.
    string text_exact = 3;
    // Bounded windows of rendered text surrounding `text_exact`, used to disambiguate
    // repeated phrases and to re-locate the span after edits.
    string text_prefix = 4;
    string text_suffix = 5;
    // The mark's color preset key (e.g. "yellow"). Empty means the default.
    string color = 6;
    // Render as an underline rather than a background highlight.
    bool underline = 7;
  }

  message EpubAnnotation {
    // The name of the attachment this annotation is anchored to, e.g. "attachments/{uid}".
    string attachment_name = 1;
    // The EPUB CFI range identifying the highlighted text span.
    string cfi_range = 2;
    // Optional selected text snippet, shown as the comment's anchor label and used as
    // a fallback if the CFI range can't be resolved.
    string text_snippet = 3;
    // The mark's color, as a preset key (e.g. "yellow", "blue"). Empty means the default.
    string color = 4;
    // When true the mark renders as an underline in `color`; otherwise as a background highlight.
    bool underline = 5;
  }
}
