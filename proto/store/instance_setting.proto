syntax = "proto3";

package memos.store;

import "google/protobuf/timestamp.proto";
import "google/type/color.proto";

option go_package = "gen/store";

enum InstanceSettingKey {
  INSTANCE_SETTING_KEY_UNSPECIFIED = 0;
  // BASIC is the key for basic settings.
  BASIC = 1;
  // GENERAL is the key for general settings.
  GENERAL = 2;
  // STORAGE is the key for storage settings.
  STORAGE = 3;
  // MEMO_RELATED is the key for memo related settings.
  MEMO_RELATED = 4;
  // TAGS is the key for tag metadata.
  TAGS = 5;
  // NOTIFICATION is the key for notification transport settings.
  NOTIFICATION = 6;
  // AI is the key for AI provider settings.
  AI = 7;
  // BACKUP is the key for database backup settings/status.
  BACKUP = 8;
  // STORAGE_MIGRATION is the key for the in-flight attachment storage migration.
  STORAGE_MIGRATION = 9;
}

message InstanceSetting {
  InstanceSettingKey key = 1;
  oneof value {
    InstanceBasicSetting basic_setting = 2;
    InstanceGeneralSetting general_setting = 3;
    InstanceStorageSetting storage_setting = 4;
    InstanceMemoRelatedSetting memo_related_setting = 5;
    InstanceTagsSetting tags_setting = 6;
    InstanceNotificationSetting notification_setting = 7;
    InstanceAISetting ai_setting = 8;
    InstanceBackupSetting backup_setting = 9;
    InstanceStorageMigrationSetting storage_migration_setting = 10;
  }
}

// InstanceBackupSetting persists the config and status of the weekly/manual SQLite-to-S3 database backup.
message InstanceBackupSetting {
  // path_template is the S3 object key template for backup files, relative to the configured
  // bucket. Supports the same placeholders as InstanceStorageSetting.filepath_template
  // ({timestamp}, {uuid}, {year}, {month}, {day}, {hour}, {minute}, {second}); there is no
  // {filename} placeholder since backups have no source filename.
  // e.g. backups/{timestamp}_{uuid}.db.gz
  string path_template = 4;
  // last_backup_time is when the most recent backup attempt finished.
  google.protobuf.Timestamp last_backup_time = 1;
  // last_backup_success indicates whether the most recent backup attempt succeeded.
  bool last_backup_success = 2;
  // last_backup_error holds the error message when last_backup_success is false.
  string last_backup_error = 3;
}

message InstanceBasicSetting {
  // The secret key for instance. Mainly used for session management.
  string secret_key = 1;
  // The current schema version of database.
  string schema_version = 2;
}

message InstanceGeneralSetting {
  // disallow_user_registration disallows user registration.
  bool disallow_user_registration = 2;
  // disallow_password_auth disallows password authentication.
  bool disallow_password_auth = 3;
  // additional_script is the additional script.
  string additional_script = 4;
  // additional_style is the additional style.
  string additional_style = 5;
  // custom_profile is the custom profile.
  InstanceCustomProfile custom_profile = 6;
  // week_start_day_offset is the week start day offset from Sunday.
  // 0: Sunday, 1: Monday, 2: Tuesday, 3: Wednesday, 4: Thursday, 5: Friday, 6: Saturday
  // Default is Sunday.
  int32 week_start_day_offset = 7;
  // disallow_change_username disallows changing username.
  bool disallow_change_username = 8;
  // disallow_change_nickname disallows changing nickname.
  bool disallow_change_nickname = 9;
}

message InstanceCustomProfile {
  string title = 1;
  string description = 2;
  string logo_url = 3;
}

message InstanceStorageSetting {
  enum StorageType {
    STORAGE_TYPE_UNSPECIFIED = 0;
    // STORAGE_TYPE_DATABASE is the database storage type.
    DATABASE = 1;
    // STORAGE_TYPE_LOCAL is the local storage type.
    LOCAL = 2;
    // STORAGE_TYPE_S3 is the S3 storage type.
    S3 = 3;
  }
  // storage_type is the storage type.
  StorageType storage_type = 1;
  // LEGACY-COMPAT(storage/three-level-path): filepath_template is the whole object path as a
  // single free-form string. It is still the source of truth for LOCAL storage, but for S3 the
  // path is now expressed as root_prefix + workspace directory + filename_template. It is kept
  // because it is the only thing an old instance can be decomposed from; see
  // Store.GetInstanceStorageSetting.
  // e.g. assets/{timestamp}_{filename}
  string filepath_template = 2;
  // The max upload size in megabytes.
  int64 upload_size_limit_mb = 3;
  // The S3 config.
  StorageS3Config s3_config = 4;
  // filename_template names the final path segment of an S3 object; it governs the file name
  // only, never directories. The directory between the root prefix and the file name is decided
  // by the system (it is the owning workspace's storage slug) and is not configurable.
  // e.g. {timestamp}_{uuid}_{filename}
  string filename_template = 5;
}

// Reference: https://developers.cloudflare.com/r2/examples/aws/aws-sdk-go/
message StorageS3Config {
  string access_key_id = 1;
  string access_key_secret = 2;
  string endpoint = 3;
  string region = 4;
  string bucket = 5;
  bool use_path_style = 6;
  // insecure_skip_tls_verify disables TLS certificate verification when connecting
  // to the S3 endpoint. Only enable this for trusted endpoints that use a self-signed
  // certificate; it removes protection against man-in-the-middle attacks.
  bool insecure_skip_tls_verify = 7;
  // root_prefix is the directory every attachment object is written under, relative to the
  // bucket root. Empty means the bucket root itself. Together with `endpoint` and `bucket` it
  // forms the location triple that answers "which pile of bytes are the attachments" -- unlike
  // the remaining fields, which only say how to reach the same pile, changing any of the three
  // strands every existing object, so all three are rejected by UpdateInstanceSetting once S3
  // attachments exist and can only be changed through an attachment storage migration.
  string root_prefix = 8;
}

// InstanceStorageMigrationSetting holds the target configuration and the state machine of an
// attachment storage migration: moving every S3 attachment object to a new
// (endpoint, bucket, root_prefix) location without changing a single attachment's public URI.
//
// It is a singleton whose shape keeps changing as the flow is built out, and nothing queries it
// by field, which is exactly the shape a settings blob is good at. The opposite kind of data --
// one row per attachment, claimed by status -- lives in the attachment_migration_job table.
// See docs/dev/design/20260902-attachment-storage-migration.md.
message InstanceStorageMigrationSetting {
  // State is the migration lifecycle. Absent setting (or STATE_UNSPECIFIED) means no migration
  // exists and the instance behaves exactly as it did before this feature.
  enum State {
    STATE_UNSPECIFIED = 0;
    // DRAFT: the target configuration is being edited. Nothing is frozen, nothing is copied,
    // and discarding it is free.
    DRAFT = 1;
    // PRECHECKED: a probe object was written, read back and deleted at the target location.
    // Editing the target configuration drops back to DRAFT.
    PRECHECKED = 2;
    // FROZEN: attachment writes are closed instance-wide. Reads are unaffected.
    FROZEN = 3;
    // MIGRATING: objects are being copied to the target location. Resumable.
    MIGRATING = 4;
    // RECONCILING: every attachment's target object is being verified.
    RECONCILING = 5;
    // READY: reconciliation passed; the switch may be applied.
    READY = 6;
  }

  State state = 1;
  // target_s3_config is where the attachments are going. Only the location triple is allowed to
  // differ from the live config; a migration that moves nowhere is rejected at entry.
  StorageS3Config target_s3_config = 2;
  google.protobuf.Timestamp create_time = 3;
  google.protobuf.Timestamp update_time = 4;
  PrecheckResult precheck = 5;
  Progress progress = 6;
  // last_error is the most recent failure of the background worker itself (as opposed to a
  // single object's failure, which is recorded on that object's row).
  string last_error = 7;

  // Progress mirrors the per-status counts of the work list so the settings blob alone answers
  // "how far along is this", including after the work list has been dropped at switch time.
  message Progress {
    int64 total = 1;
    int64 pending = 2;
    int64 done = 3;
    // skipped counts attachments whose source object does not exist. They were already broken
    // before the migration and deliberately do not block it.
    int64 skipped = 4;
    // failed counts attachments that could not be copied or did not verify. Any of these blocks
    // the switch.
    int64 failed = 5;
  }

  // PrecheckResult records the outcome of the write-read-delete probe against the target. A
  // bucket that exists and credentials that authenticate prove nothing on their own: missing
  // PutObject permission, a bucket policy that rejects the prefix, or a header-rewriting proxy
  // in front of the endpoint only ever surface on a real round trip.
  message PrecheckResult {
    bool passed = 1;
    // error is the failure reason, verbatim enough for an admin to act on. Empty when passed.
    string error = 2;
    google.protobuf.Timestamp check_time = 3;
    // probe_key is the object key the probe used, so a probe object left behind by a crash
    // between write and delete can be found and removed by hand.
    string probe_key = 4;
    // server_side_copy reports whether the migration can hand the copy to S3 itself
    // (CopyObject) instead of streaming every byte through Toucan. It requires the endpoint,
    // credentials and path style to be identical on both sides, which is the common
    // "same account, different bucket or prefix" case.
    bool server_side_copy = 5;
  }
}

message InstanceMemoRelatedSetting {
  reserved 2;
  reserved "display_with_update_time";
  // content_length_limit is the limit of content length. Unit is byte.
  int32 content_length_limit = 3;
  // enable_double_click_edit enables editing on double click.
  bool enable_double_click_edit = 4;
  // reactions is the list of reactions.
  repeated string reactions = 7;
}

message InstanceTagMetadata {
  // Optional background color for the tag label.
  // When unset, the default tag color is used.
  google.type.Color background_color = 1;
  // Whether memos with this tag should have their content blurred.
  bool blur_content = 2;
}

// Active tag metadata is stored in per-user tag settings.
// This message remains for backward compatibility with existing clients and migrations.
message InstanceTagsSetting {
  // Map of tag name pattern to tag metadata.
  // Each key is treated as an anchored regular expression (^pattern$),
  // so a single entry like "project/.*" matches all tags under that prefix.
  // Exact tag names are also valid (they are trivially valid regex patterns).
  map<string, InstanceTagMetadata> tags = 1;
}

message InstanceNotificationSetting {
  EmailSetting email = 1;

  message EmailSetting {
    bool enabled = 1;
    string smtp_host = 2;
    int32 smtp_port = 3;
    string smtp_username = 4;
    string smtp_password = 5;
    string from_email = 6;
    string from_name = 7;
    string reply_to = 8;
    bool use_tls = 9;
    bool use_ssl = 10;
  }
}

message InstanceAISetting {
  // providers is the list of AI provider configurations available instance-wide.
  repeated AIProviderConfig providers = 1;

  // transcription is the speech-to-text feature configuration.
  // When unset or transcription.provider_id is empty, transcription is disabled.
  TranscriptionConfig transcription = 2;

  // default_provider_id references an entry in providers[].id. AI features that have
  // no feature-specific provider configuration of their own fall back to this provider.
  // Empty string means no default is set.
  string default_provider_id = 3;

  // format_pdf_text enables running a PDF attachment's extracted plain text through the default
  // AI provider to restructure it into Markdown in the plain-text panel. When disabled (the
  // default), the raw extracted text is shown as-is, avoiding the slow, billable LLM call.
  bool format_pdf_text = 4;

  // embedding configures the text-embedding model used for semantic (vector) search.
  // When unset or embedding.provider_id is empty, semantic search is disabled and
  // search falls back to full-text (keyword) retrieval only.
  EmbeddingConfig embedding = 5;
}

// EmbeddingConfig configures the text-embedding model used to power semantic search.
message EmbeddingConfig {
  // provider_id references an entry in InstanceAISetting.providers[].id.
  // Empty string means semantic search is disabled (keyword-only fallback).
  string provider_id = 1;

  // model is the provider-specific embedding model identifier.
  // Empty string falls back to the engine default.
  // OPENAI examples: text-embedding-3-small, text-embedding-3-large.
  // GEMINI examples: text-embedding-004.
  string model = 2;

  // disabled turns off vector building and semantic retrieval without discarding the
  // provider/model selection above, so it can be restored later. While disabled the
  // indexer still stores chunk text (keyword/FTS search keeps working) but calls no
  // embedding API; re-enabling triggers a full backfill of the missing vectors.
  // Inverted (rather than an `enabled` flag) so the zero value preserves the
  // pre-existing behaviour of embedding whenever a provider is configured.
  bool disabled = 3;
}

message AIProviderConfig {
  string id = 1;
  string title = 2;
  AIProviderType type = 3;
  string endpoint = 4;
  // api_key is write-only at the API layer and is required by the server to call providers.
  string api_key = 5;
  // models is the list of manually-added model IDs available for this provider.
  repeated AIModelConfig models = 6;
}

// AIModelConfig is a manually-added model entry under a provider.
message AIModelConfig {
  // id is the model identifier sent to the provider API (e.g. "deepseek-chat").
  string id = 1;
  // name is an optional display name. Falls back to id when empty.
  string name = 2;
}

enum AIProviderType {
  AI_PROVIDER_TYPE_UNSPECIFIED = 0;
  OPENAI = 1;
  GEMINI = 2;
}

// TranscriptionConfig configures the speech-to-text feature.
message TranscriptionConfig {
  // provider_id references an entry in InstanceAISetting.providers[].id.
  // Empty string means transcription is disabled.
  string provider_id = 1;

  // model is the provider-specific model identifier.
  // Empty string falls back to the engine default.
  // OPENAI examples:
  //   - whisper-1 (legacy, lower cost)
  //   - gpt-4o-transcribe, gpt-4o-mini-transcribe (higher quality)
  //   - gpt-4o-transcribe-diarize (includes speaker labels)
  // GEMINI examples:
  //   - gemini-2.5-flash (default, multimodal call)
  //   - gemini-2.5-pro
  string model = 2;

  // language is the default ISO 639-1 language hint sent to the provider.
  // Empty string lets the provider auto-detect.
  string language = 3;

  // prompt is a default spelling/vocabulary hint passed to the provider.
  // Used as the OpenAI Whisper "prompt" parameter (a soft hint that the model
  // may ignore) and folded into the Gemini generation prompt as a "Context and
  // spelling hints" block (which the LLM will treat more literally).
  string prompt = 4;
}
