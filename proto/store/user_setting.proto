syntax = "proto3";

package memos.store;

import "google/protobuf/timestamp.proto";
import "google/type/color.proto";

option go_package = "gen/store";

message UserSetting {
  enum Key {
    KEY_UNSPECIFIED = 0;
    // General user settings.
    GENERAL = 1;
    // The shortcuts of the user.
    SHORTCUTS = 4;
    // The webhooks of the user.
    WEBHOOKS = 5;
    // Refresh tokens for the user.
    REFRESH_TOKENS = 6;
    // Personal access tokens for the user.
    PERSONAL_ACCESS_TOKENS = 7;
    // Per-user tag metadata.
    TAGS = 8;
    // The last workspace/document the user had open in the Notebook home page.
    LAST_OPENED = 9;
    // Per-user RAG search preferences.
    RAG_SEARCH = 10;
    // The user's master key for `toucan-secret` blocks, wrapped under their
    // passphrase. Opaque to the server, which cannot unwrap it.
    SECRET_KEY = 11;
  }

  int32 user_id = 1;

  Key key = 2;
  oneof value {
    GeneralUserSetting general = 3;
    ShortcutsUserSetting shortcuts = 6;
    WebhooksUserSetting webhooks = 7;
    RefreshTokensUserSetting refresh_tokens = 8;
    PersonalAccessTokensUserSetting personal_access_tokens = 9;
    TagsUserSetting tags = 10;
    LastOpenedUserSetting last_opened = 11;
    RagSearchUserSetting rag_search = 12;
    SecretKeyUserSetting secret_key = 13;
  }
}

// SecretKeyUserSetting holds the user's `toucan-secret` master key, sealed under
// their passphrase in the browser.
//
// Every field is opaque to the server, exactly as in SecretBlock: this is the
// same envelope format, and its plaintext is the base64 master key. Storing it
// here rather than in its own table is deliberate — it is one record per user
// whose whole lifecycle is "set it, replace it when the passphrase changes",
// which is what a user setting already is.
//
// The server can neither unwrap this nor help a user who forgets the passphrase.
message SecretKeyUserSetting {
  // Key derivation for the wrapping key. Always "pbkdf2-sha256" today.
  string kdf = 1;
  // Iteration count for the KDF. Higher than the per-block figure, because this
  // derivation runs once per session rather than once per block.
  int32 kdf_iterations = 2;
  // The AEAD cipher. Always "aes-256-gcm" today.
  string cipher = 3;
  // Base64 KDF salt.
  string salt = 4;
  // Base64 AEAD nonce.
  string nonce = 5;
  // Base64 HMAC over the canonical parameter header, so the client can tell a
  // wrong passphrase from a damaged wrapper.
  string verifier = 6;
  // Base64 AEAD ciphertext of the master key, tag appended.
  string wrapped_key = 7;
}

// RagSearchMode selects how hybrid search combines keyword and semantic retrieval.
enum RagSearchMode {
  RAG_SEARCH_MODE_UNSPECIFIED = 0;
  // Combine full-text (keyword) and vector (semantic) retrieval via RRF.
  MIXED = 1;
  // Full-text (keyword) retrieval only.
  KEYWORD = 2;
  // Vector (semantic) retrieval only.
  SEMANTIC = 3;
  // Plain substring (SQL LIKE) retrieval over raw memo title/content, bypassing
  // the chunk/FTS/vector index entirely. Covers every document type immediately.
  LIKE = 4;
}

message RagSearchUserSetting {
  // max_result_docs caps the number of documents returned by a search.
  // Zero falls back to the engine default (20).
  int32 max_result_docs = 1;
  // mode selects the retrieval strategy. Unspecified falls back to MIXED.
  // When no embedding model is configured, search is forced to KEYWORD regardless.
  RagSearchMode mode = 2;
}

message LastOpenedUserSetting {
  // The workspace resource name last opened. Format: workspaces/{workspace}
  string workspace = 1;
  // The memo resource name last opened. Format: memos/{memo}
  // Deprecated: superseded by workspace_memos, kept for backward compatibility.
  string memo = 2;
  // Map of workspace resource name to the memo resource name last opened within it.
  map<string, string> workspace_memos = 3;
}

message GeneralUserSetting {
  // The user's locale.
  string locale = 1;
  // The user's memo visibility setting.
  string memo_visibility = 2;
  // The user's theme preference.
  // This references a CSS file in the web/public/themes/ directory.
  string theme = 3;
}

message UserTagMetadata {
  // Optional background color for the tag label.
  // When unset, the default tag color is used.
  google.type.Color background_color = 1;
  // Whether memos with this tag should have their content blurred.
  bool blur_content = 2;
}

message TagsUserSetting {
  // Map of tag name pattern to tag metadata.
  // Each key is treated as an anchored regular expression (^pattern$),
  // so a single entry like "project/.*" matches all tags under that prefix.
  // Exact tag names are also valid.
  map<string, UserTagMetadata> tags = 1;
}

message RefreshTokensUserSetting {
  message RefreshToken {
    // Unique identifier (matches 'tid' claim in JWT)
    string token_id = 1;
    // When the token expires
    google.protobuf.Timestamp expires_at = 2;
    // When the token was created
    google.protobuf.Timestamp created_at = 3;
    // Client information for session management UI
    ClientInfo client_info = 4;
    // Optional description
    string description = 5;
  }

  message ClientInfo {
    // User agent string of the client.
    string user_agent = 1;
    // IP address of the client.
    string ip_address = 2;
    // Optional. Device type (e.g., "mobile", "desktop", "tablet").
    string device_type = 3;
    // Optional. Operating system (e.g., "iOS 17.0", "Windows 11").
    string os = 4;
    // Optional. Browser name and version (e.g., "Chrome 119.0").
    string browser = 5;
  }

  repeated RefreshToken refresh_tokens = 1;
}

message PersonalAccessTokensUserSetting {
  message PersonalAccessToken {
    // Unique identifier for this token
    string token_id = 1;
    // SHA-256 hash of the actual token
    string token_hash = 2;
    // User-provided description
    string description = 3;
    // When the token expires (null = never)
    google.protobuf.Timestamp expires_at = 4;
    // When the token was created
    google.protobuf.Timestamp created_at = 5;
    // When the token was last used
    google.protobuf.Timestamp last_used_at = 6;
  }
  repeated PersonalAccessToken tokens = 1;
}

message ShortcutsUserSetting {
  message Shortcut {
    string id = 1;
    string title = 2;
    string filter = 3;
  }
  repeated Shortcut shortcuts = 1;
}

message WebhooksUserSetting {
  message Webhook {
    // Unique identifier for the webhook
    string id = 1;
    // Descriptive title for the webhook
    string title = 2;
    // The webhook URL endpoint
    string url = 3;
    // Optional signing secret for webhook authentication.
    string signing_secret = 4;
  }
  repeated Webhook webhooks = 1;
}
